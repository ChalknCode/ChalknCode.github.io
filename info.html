<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>常用資訊 — 805 班級網站</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .info-section { margin-bottom: 32px; }
    .info-img-wrap {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .info-img-wrap img {
      width: 100%; height: auto;
      border-radius: 8px; display: block;
    }
    .info-link-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid rgba(0,0,0,0.07);
      box-shadow: var(--shadow);
      text-decoration: none; color: var(--text);
      transition: all 0.2s; margin-bottom: 10px;
    }
    .info-link-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); color: var(--primary); }
    .info-link-icon { font-size: 2rem; }
    .info-link-title { font-size: 1rem; font-weight: 700; }
    .info-link-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="menu-overlay" id="menu-overlay"></div>
  <nav class="mobile-menu" id="mobile-menu">
    <div class="menu-title">✏️ 805 班級網站</div>
    <a href="index.html" data-page="index.html"><span class="menu-icon">🏠</span> 首頁</a>
    <a href="announcement.html" data-page="announcement.html"><span class="menu-icon">📢</span> 公告</a>
    <a href="gallery.html" data-page="gallery.html"><span class="menu-icon">🖼</span> 相簿</a>
    <a href="info.html" data-page="info.html"><span class="menu-icon">⭐</span> 常用資訊</a>
    <a href="query.html" data-page="query.html"><span class="menu-icon">🔍</span> 成績查詢</a>
  </nav>

  <header class="site-header">
    <a class="site-logo" href="index.html"><span>✏️</span> 805 班級網站</a>
    <nav class="desktop-nav">
      <a class="nav-link" href="index.html" data-page="index.html">首頁</a>
      <a class="nav-link" href="announcement.html" data-page="announcement.html">公告</a>
      <a class="nav-link" href="gallery.html" data-page="gallery.html">相簿</a>
      <a class="nav-link" href="info.html" data-page="info.html">常用資訊</a>
      <a class="nav-link" href="query.html" data-page="query.html">成績查詢</a>
    </nav>
    <button class="burger-btn" id="burger" aria-label="選單">
      <span></span><span></span><span></span>
    </button>
  </header>

  <section class="section">
    <div class="section-header">
      <div class="section-title">⭐ 常用資訊</div>
    </div>

    <!-- 行事曆 -->
    <div class="info-section">
      <div class="section-title" style="margin-bottom:12px;">📅 115學年度第一學期行事曆</div>
      <div class="info-img-wrap">
        <img src="images/calendar.jpg" alt="115學年度第一學期行事曆">
      </div>
    </div>

    <!-- 課表 -->
    <div class="info-section">
      <div class="section-title" style="margin-bottom:12px;">📋 班級課表</div>
      <div class="info-img-wrap">
        <img src="images/schedule.jpg" alt="班級課表">
      </div>
    </div>

    <!-- 交通車 -->
    <div class="info-section" id="bus">
      <div class="section-title" style="margin-bottom:12px;">🚌 115學年度交通車各路線站點時間表</div>
      <div class="info-img-wrap">
        <img src="images/bus.jpg" alt="交通車各路線站點時間表">
      </div>
    </div>
  </section>

  <footer class="site-footer">© 2026 805 班級網站</footer>

  <nav class="bottom-nav">
    <a class="bnav-item" href="index.html" data-page="index.html"><span class="bnav-icon">🏠</span>首頁</a>
    <a class="bnav-item" href="announcement.html" data-page="announcement.html"><span class="bnav-icon">📢</span>公告</a>
    <a class="bnav-item" href="gallery.html" data-page="gallery.html"><span class="bnav-icon">🖼</span>相簿</a>
    <a class="bnav-item" href="info.html" data-page="info.html"><span class="bnav-icon">⭐</span>常用</a>
    <a class="bnav-item" href="query.html" data-page="query.html"><span class="bnav-icon">🔍</span>成績查詢</a>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
