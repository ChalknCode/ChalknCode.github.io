<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>成績查詢系統 - 805 班級網站</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Optional now, kept for fallback if needed -->
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Desktop Header -->
  <header class="header-glass sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-300 to-blue-300 flex items-center justify-center text-white font-bold text-lg shadow-sm">
            805
          </div>
          <h1 class="text-xl font-bold text-gray-800 hidden md:block" id="systemTitle">805 學生查詢系統</h1>
        </a>
      </div>
      <!-- Desktop Nav -->
      <nav class="hidden md:flex space-x-2">
        <a href="index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">首頁</a>
        <a href="announcement.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">最新公告</a>
        <a href="gallery.html" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">相簿</a>
        <a href="query.html" class="px-4 py-2 rounded-lg text-sm font-medium text-[#c2516a] bg-pink-50 transition-colors">成績查詢</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 mb-20 md:mb-8">
    
    <!-- Login Section -->
    <div id="loginSection" class="max-w-md mx-auto mt-10">
      <div class="text-center mb-8">
        <div class="text-5xl mb-4">🔍</div>
        <h2 class="text-2xl font-bold text-gray-800">學生查詢系統</h2>
        <p class="text-gray-500 mt-2">請輸入您的資料以查看成績與計點</p>
      </div>
      
      <div class="glass-card p-6 md:p-8">
        <form id="loginForm" class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">班級座號</label>
            <input type="text" id="seatNo" required placeholder="例如：80501" 
                   class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-lg focus:outline-none focus:border-[#c2516a] focus:ring-1 focus:ring-[#c2516a] transition-colors" pattern="[0-9]+">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">身分證字號</label>
            <input type="password" id="idNumber" required placeholder="請輸入完整身分證字號"
                   class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-lg focus:outline-none focus:border-[#c2516a] focus:ring-1 focus:ring-[#c2516a] transition-colors">
          </div>
          
          <div id="loginError" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100"></div>
          
          <button type="submit" id="loginBtn" class="w-full py-3 px-4 bg-gradient-to-r from-[#c2516a] to-[#d8768a] text-white rounded-lg font-bold hover:shadow-lg transform transition-all duration-200 focus:outline-none">
            登入查詢
          </button>
        </form>
      </div>
    </div>

    <!-- Dashboard Main Area (Hidden initially) -->
    <div id="dashboardSection" class="hidden space-y-6">
      
      <!-- Student Info Card -->
      <div class="glass-card p-6 flex flex-col md:flex-row justify-between items-center relative overflow-hidden">
        <div class="absolute right-0 top-0 w-32 h-32 bg-pink-200 opacity-20 rounded-full blur-2xl -mr-10 -mt-10"></div>
        <div class="absolute left-0 bottom-0 w-24 h-24 bg-blue-200 opacity-20 rounded-full blur-xl -ml-10 -mb-10"></div>
        
        <div class="z-10 w-full">
          <div class="flex justify-between items-start mb-4">
            <h2 class="text-lg font-bold text-gray-800">學生資訊</h2>
            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">已登入</span>
          </div>
          <div class="border-t border-dashed border-gray-200 pt-4 flex flex-wrap gap-x-6 gap-y-2 text-sm">
            <div><span class="text-gray-500">姓名：</span><span id="studentName" class="font-bold text-gray-800 text-base"></span></div>
            <div><span class="text-gray-500">班級：</span><span id="studentClass" class="font-bold text-gray-800 text-base"></span></div>
            <div><span class="text-gray-500">座號：</span><span id="studentSeatNo" class="font-bold text-gray-800 text-base"></span></div>
          </div>
        </div>
      </div>

      <!-- VIEW: Menu (大按鈕首頁) -->
      <div id="view-menu" class="fade-in">
        <h3 class="text-xl font-bold text-gray-800 mb-4 mt-8">你想查看什麼？</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <button onclick="switchView('exam')" id="btn-exam" class="dash-btn rounded-xl p-6 text-left flex items-center gap-4 group">
            <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">🎓</div>
            <div>
              <div class="text-lg font-bold text-gray-800">段考成績</div>
              <div class="text-sm text-gray-500 mt-1">段考成績、排名與迷你分佈圖</div>
            </div>
          </button>
          
          <button onclick="switchView('life')" id="btn-life" class="dash-btn rounded-xl p-6 text-left flex items-center gap-4 group">
            <div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">🛡️</div>
            <div>
              <div class="text-lg font-bold text-gray-800">生活計點</div>
              <div class="text-sm text-gray-500 mt-1">學校日常表現與班級積分排名</div>
            </div>
          </button>
        </div>
      </div>

      <!-- VIEW: Exam -->
      <div id="view-exam" class="hidden fade-in space-y-6">
        <button onclick="switchView('menu')" class="px-4 py-2 bg-white/60 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 transition-colors">← 返回主畫面</button>
        
        <div class="glass-card p-6">
          <div class="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-6">
            <div>
              <h3 class="text-2xl font-bold text-gray-800">段考成績</h3>
              <p class="text-sm text-gray-500 mt-1">請選擇要查詢的段考</p>
            </div>
            <select id="examSelector" class="px-4 py-2 border border-gray-300 rounded-lg font-bold text-gray-700 focus:outline-none focus:border-[#c2516a] bg-white w-full md:w-auto shadow-sm">
            </select>
          </div>
          
          <div id="examContent">
            <!-- 頂部 4 卡片 (強制 4 欄並排) -->
            <div class="grid grid-cols-4 gap-2 md:gap-4 mb-6">
                <div class="bg-white p-2 md:p-4 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-emerald-400 flex flex-col justify-center items-center">
                    <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 text-center whitespace-nowrap">班級排名</div>
                    <div class="text-lg md:text-3xl font-black text-gray-800" id="cardRank">-</div>
                </div>
                <div class="bg-white p-2 md:p-4 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-orange-400 flex flex-col justify-center items-center">
                    <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 text-center whitespace-nowrap">校排(估)</div>
                    <div class="text-lg md:text-3xl font-black text-gray-800" id="cardSchoolRank">-</div>
                </div>
                <div class="bg-white p-2 md:p-4 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-indigo-400 flex flex-col justify-center items-center">
                    <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 text-center whitespace-nowrap">總平均</div>
                    <div class="text-lg md:text-3xl font-black text-gray-800" id="cardAvg">-</div>
                </div>
                <div class="bg-white p-2 md:p-4 rounded-xl shadow-sm border border-gray-100 border-t-4 border-t-yellow-400 flex flex-col justify-center items-center">
                    <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 text-center whitespace-nowrap">總分</div>
                    <div class="text-lg md:text-3xl font-black text-gray-800" id="cardTotal">-</div>
                </div>
            </div>

            <!-- 圖表切換按鈕 -->
            <div class="flex justify-end mb-2">
                <div class="inline-flex bg-gray-100 rounded-lg p-1">
                    <button id="toggleChartClass" class="px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800">班級分佈圖</button>
                    <button id="toggleChartSchool" class="px-3 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800">全校分佈圖</button>
                </div>
            </div>

            <!-- 成績表格 -->
            <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead class="bg-gray-50 text-gray-600 text-sm border-b border-gray-200">
                        <tr>
                            <th class="p-3 font-bold w-1/5">科目</th>
                            <th class="p-3 text-center font-bold w-1/5">您的分數</th>
                            <th class="p-3 text-center font-bold w-1/5" id="avgHeaderTitle">班平</th>
                            <th class="p-3 font-bold w-2/5">分佈落點 (<span id="chartTypeLabel">班級</span>)</th>
                        </tr>
                    </thead>
                    <tbody id="examTableBody" class="divide-y divide-gray-100">
                        <!-- JS Render -->
                    </tbody>
                </table>
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW: Life Points -->
      <div id="view-life" class="hidden fade-in space-y-6">
        <button onclick="switchView('menu')" class="px-4 py-2 bg-white/60 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 transition-colors">← 返回主畫面</button>
        
        <div class="glass-card p-0 overflow-hidden">
            <!-- 頂部計分板 (緊湊排列) -->
            <div class="bg-gradient-to-r from-[#f0fdf4] to-white border-l-[6px] border-emerald-500 p-6 shadow-sm border-b border-gray-100">
                <div class="flex flex-row items-center gap-6 md:gap-12">
                    <!-- 總分 -->
                    <div>
                        <div class="text-emerald-800 text-sm font-bold mb-1">生活計點總積分</div>
                        <div class="text-4xl md:text-5xl font-black text-emerald-600 tracking-tight"><span id="totalLifePoints">0</span> <span class="text-xl md:text-2xl font-bold ml-1">分</span></div>
                        <div class="text-xs text-gray-500 mt-1 font-medium">(初始分數：<span id="initialPoints">0</span> 分)</div>
                    </div>
                    <!-- 分隔線 -->
                    <div class="hidden md:block w-px h-16 bg-gray-200"></div>
                    <!-- 排名與前後名次 -->
                    <div class="flex flex-col justify-center">
                        <div class="text-emerald-800 text-sm font-bold mb-1">班級排名</div>
                        <div class="flex items-end gap-3 mb-2">
                            <div class="text-3xl md:text-4xl font-black text-gray-800"><span id="lpRank">-</span></div>
                        </div>
                        <div class="flex gap-2 text-[11px] md:text-xs">
                            <div class="bg-white px-2 py-1 rounded shadow-sm text-gray-600 border border-emerald-100 flex items-center gap-1">
                                <span class="font-bold text-gray-400">前一</span>
                                <b class="text-gray-800" id="lpPrev">-</b>
                            </div>
                            <div class="bg-white px-2 py-1 rounded shadow-sm text-gray-600 border border-rose-100 flex items-center gap-1">
                                <span class="font-bold text-gray-400">後一</span>
                                <b class="text-rose-600" id="lpNext">-</b>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 每日紀錄列表 -->
            <div class="p-6">
                <h4 class="font-bold text-gray-800 mb-4 border-b pb-2">計點紀錄 (依日期排序)</h4>
                <div id="lifePointsList" class="space-y-4">
                    <!-- JS Render -->
                </div>
            </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a class="bnav-item" href="index.html" data-page="index.html"><span class="bnav-icon">🏠</span>首頁</a>
    <a class="bnav-item" href="announcement.html" data-page="announcement.html"><span class="bnav-icon">📢</span>公告</a>
    <a class="bnav-item" href="gallery.html" data-page="gallery.html"><span class="bnav-icon">📸</span>相簿</a>
    <a class="bnav-item active" href="query.html" data-page="query.html"><span class="bnav-icon">🔍</span>查詢</a>
  </nav>

  <script src="js/config.js?v=3"></script>
  <script src="js/nav.js?v=3"></script>
  <script src="js/query.js?v=3"></script>
</body>
</html>
