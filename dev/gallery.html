  <style>
    /* 分類標籤 */
    .cat-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none; padding: 0 0 12px;
      flex-wrap: nowrap;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 7px 18px; border-radius: 20px;
      border: 2px solid var(--border);
      background: var(--card-bg); color: var(--text);
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: all 0.2s; flex-shrink: 0;
    }
    .cat-tab.active {
      background: var(--primary); color: #fff;
      border-color: var(--primary);
    }

    /* 子分類標題 */
    .sub-heading {
      font-size: 0.88rem; font-weight: 700;
      color: var(--text-muted); margin: 18px 0 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .sub-heading::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* Instagram 方格 */
    .insta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-bottom: 4px;
    }
    @media (min-width: 600px) {
      .insta-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; }
    }
    @media (min-width: 900px) {
      .insta-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    }

    .insta-item {
      position: relative; aspect-ratio: 1;
      overflow: hidden; cursor: pointer;
      background: var(--primary-light);
      border-radius: 4px;
    }
    .insta-item img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.3s;
    }
    .insta-item:hover img { transform: scale(1.06); }
    .insta-item .insta-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.25s;
      display: flex; align-items: flex-end;
      padding: 8px;
    }
    .insta-item:hover .insta-overlay { opacity: 1; }
    .insta-label {
      color: #fff; font-size: 0.7rem; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      line-height: 1.3;
    }

    /* 無封面時的方格 */
    .insta-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
      padding: 8px; text-align: center;
    }
    .insta-placeholder .ph-icon { font-size: 1.8rem; margin-bottom: 4px; }
    .insta-placeholder .ph-name {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text); line-height: 1.3;
    }

    /* 空狀態 */
    .cat-panel { display: none; }
    .cat-panel.active { display: block; }
  </style>

  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // 避免快取舊的 config 導致 GALLERY undefined
    const sheetName = (CONFIG.SHEETS && CONFIG.SHEETS.GALLERY) ? CONFIG.SHEETS.GALLERY : '相簿';
    console.log("Fetching gallery from sheet:", sheetName);
    
    const data = await fetchSheetData(sheetName);
    console.log("Gallery data loaded:", data);
    
    const tabsEl = document.getElementById('cat-tabs');
    const contentEl = document.getElementById('gallery-content');

    if (!data.length) {
      contentEl.innerHTML = `<div class="empty-state">
        <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
        <p>尚未新增相簿</p>
        <p style="font-size:0.8rem;margin-top:8px;">請在試算表「相簿」工作表新增資料</p>
      </div>`;
      return;
    }

    // 建立巢狀結構 { l1: { l2: { l3: [albums] } } }
    const tree = {};
    data.forEach(row => {
      const l1   = String(row['層級1'] || '').trim();
      const l2   = String(row['層級2'] || '').trim();
      const l3   = String(row['層級3'] || '').trim();
      const name = String(row['相簿名稱'] || '').trim();
      const link = String(row['相簿連結'] || '').trim();
      const cover= String(row['封面圖片'] || '').trim();
      if (!l1 || !name) return;
      if (!tree[l1]) tree[l1] = {};
      const k2 = l2 || '__root__';
      if (!tree[l1][k2]) tree[l1][k2] = {};
      const k3 = l3 || '__root__';
      if (!tree[l1][k2][k3]) tree[l1][k2][k3] = [];
      tree[l1][k2][k3].push({ name, link, cover });
    });

    const l1Keys = Object.keys(tree);

    // 渲染分類標籤
    tabsEl.innerHTML = l1Keys.map((k, i) =>
      `<button class="cat-tab ${i===0?'active':''}" onclick="switchTab(${i})">${k}</button>`
    ).join('');

    // 渲染各分類內容
    contentEl.innerHTML = l1Keys.map((l1, i) => {
      const l2obj = tree[l1];
      let html = `<div class="cat-panel ${i===0?'active':''}" id="panel-${i}">`;

      Object.entries(l2obj).forEach(([l2, l3obj]) => {
        if (l2 !== '__root__') {
          html += `<div class="sub-heading"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path></svg> ${l2}</div>`;
        }
        Object.entries(l3obj).forEach(([l3, albums]) => {
          if (l3 !== '__root__') {
            html += `<div class="sub-heading" style="font-size:0.78rem;color:var(--text-muted);"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg> ${l3}</div>`;
          }
          html += `<div class="insta-grid">`;
          albums.forEach(album => {
            const inner = album.cover
              ? `<img src="${album.cover}" alt="${album.name}" loading="lazy">
                 <div class="insta-overlay"><div class="insta-label">${album.name}</div></div>`
              : `<div class="insta-placeholder">
                   <div class="ph-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
                   <div class="ph-name">${album.name}</div>
                 </div>`;
            html += `<div class="insta-item" onclick="window.open('${album.link}','_blank')" title="${album.name}">${inner}</div>`;
          });
          html += `</div>`;
        });
      });

      html += `</div>`;
      return html;
    }).join('');
  });

  function switchTab(idx) {
    document.querySelectorAll('.cat-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
    document.querySelectorAll('.cat-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  }
  </script>
