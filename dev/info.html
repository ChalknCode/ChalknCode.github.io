  <style>
    /* 縮圖卡片 */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .info-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.07);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.22s;
    }
    .info-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.13);
    }
    .info-thumb {
      width: 100%; height: 180px;
      object-fit: cover; object-position: top;
      display: block;
    }
    .info-card-body {
      padding: 12px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .info-card-icon { font-size: 1.3rem; }
    .info-card-title { font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .info-card-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .info-card-tap {
      margin-left: auto; font-size: 0.7rem;
      color: var(--secondary); white-space: nowrap;
    }

    /* Lightbox */
    .lightbox-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 500; align-items: center; justify-content: center;
      padding: 20px;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-box {
      position: relative; max-width: 860px; width: 100%;
      max-height: 88vh;
      background: #fff; border-radius: 14px;
      overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
    }
    .lightbox-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .lightbox-title { font-weight: 700; font-size: 0.95rem; color: var(--text); }
    .lightbox-close {
      background: none; border: none; cursor: pointer;
      font-size: 1.3rem; color: var(--text-muted); padding: 4px 8px;
      border-radius: 8px; transition: background 0.15s;
    }
    .lightbox-close:hover { background: var(--primary-light); color: var(--primary); }
    .lightbox-img-wrap {
      overflow-y: auto; flex: 1;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 16px; background: #fafafa;
    }
    .lightbox-img-wrap img {
      max-width: 100%; height: auto;
      border-radius: 8px; display: block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
  </style>
</head>

  <script>
    function openLightbox(src, title) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').textContent = title;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function closeLightboxOutside(e) {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
