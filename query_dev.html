<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>805 學生查詢系統 (Beta)</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --primary: #c2516a;
      --secondary: #5c6bc0;
    }
    body {
      background: linear-gradient(135deg, #fdf6e3 0%, #fce4ec 30%, #e3f2fd 70%, #e8f5e9 100%);
      background-attachment: fixed;
      font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      color: #333;
    }
    .dev-hidden { display: none !important; }
    
    .dev-glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }
    
    
    .font-inter { font-family: 'Inter', sans-serif; }
    .dev-dash-btn {

      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: all 0.3s ease;
    }
    .dev-dash-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      background: rgba(255,255,255,1);
    }

    /* Loader Animation */
    .loader {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="antialiased pb-20 md:pb-10">

  <!-- 頂部導覽列 -->
  <header class="dev-glass-card sticky top-0 z-50 border-b border-white/50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="images/logo.png" alt="Logo" class="h-10 w-auto mix-blend-multiply object-contain">
        <h1 class="font-black text-gray-800 text-lg tracking-wide">805 學生查詢系統 <span class="bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full ml-1 align-top">Beta 測試區</span></h1>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto px-4 pt-6 pb-12">
    
    <!-- ============================================== -->
    <!-- 1. 登入畫面 (Login) -->
    <!-- ============================================== -->
    <div id="view-login" class="max-w-md mx-auto mt-4 md:mt-12">
      <div class="dev-glass-card rounded-3xl p-8 shadow-xl relative overflow-visible">
        <!-- 裝飾用背景圈圈 -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-rose-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-16 -left-16 w-32 h-32 bg-indigo-200 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>

        <div class="relative z-10 text-center mb-8">
          <h2 class="text-3xl font-black text-gray-800 mb-2">學生登入</h2>
          <p class="text-gray-500 text-sm">請輸入您的資料以查看成績與表現</p>
        </div>

        <form id="loginForm" class="relative z-10 space-y-5">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">班級座號</label>
            <input type="text" id="seatNo" required placeholder="例如：80501 或 1" 
                   class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#c2516a] focus:border-transparent outline-none transition-all placeholder-gray-400 font-medium">
          </div>
          
          <div class="relative">
            <label class="block text-sm font-bold text-gray-700 mb-1.5 ml-1">身分證字號</label>
            <input type="password" id="idNumber" required placeholder="請輸入完整身分證字號" 
                   class="w-full px-4 py-3 bg-white/80 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#c2516a] focus:border-transparent outline-none transition-all placeholder-gray-400 font-medium uppercase">
            <!-- SVG Eye Icon -->
            <button type="button" id="togglePassword" class="absolute right-3 top-[34px] p-2 text-gray-400 hover:text-gray-600 focus:outline-none">
              <svg id="eyeIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>

          <div id="loginError" class="dev-hidden bg-rose-50 text-rose-600 text-sm p-3 rounded-lg border border-rose-100 flex items-start gap-2">
            <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="errorMsgText"></span>
          </div>

          <button type="submit" id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-[#c2516a] to-[#d87085] hover:from-[#b04058] hover:to-[#c2516a] text-white rounded-xl font-bold shadow-lg shadow-rose-200 transition-all active:scale-95 flex justify-center items-center gap-2">
            <span id="btnText">登入查詢</span>
            <div id="btnLoader" class="loader dev-hidden"></div>
          </button>
        </form>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 2. 主控台 (Dashboard) -->
    <!-- ============================================== -->
    <div id="view-dashboard" class="dev-hidden space-y-6">
      <!-- 學生基本資訊 -->
      <div class="dev-glass-card rounded-2xl p-6 relative overflow-hidden">
          <div class="absolute top-0 right-0 bg-emerald-400 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">已登入</div>
          <div class="flex flex-col gap-4">
              <h2 class="text-xl md:text-2xl font-black text-gray-800 flex items-center gap-2">
                 <svg class="w-6 h-6 text-[#c2516a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                 學生資訊
              </h2>
              <div class="border-t border-dashed border-gray-200 pt-4 flex flex-col md:flex-row md:items-center gap-4 md:gap-8 text-gray-700">
                  <div class="text-sm"><span class="text-gray-400 mr-1">姓名 :</span> <span class="font-bold text-lg text-gray-800" id="studentName">-</span></div>
                  <div class="text-sm"><span class="text-gray-400 mr-1">班級 :</span> <span class="font-bold text-lg text-gray-800" id="studentClass">-</span></div>
                  <div class="text-sm"><span class="text-gray-400 mr-1">座號 :</span> <span class="font-bold text-lg text-gray-800" id="studentSeatNo">-</span></div>
                  <div class="hidden md:block w-px h-6 bg-gray-200 mx-2"></div>
                  <div class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg w-max font-bold text-sm">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                      <span id="semesterInfo">八年級上學期</span> <span id="weekInfo" class="ml-1 text-indigo-500 text-xs"></span>
                  </div>
              </div>
          </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Left Column: Buttons -->
          <div class="flex flex-col gap-4">
              
              <button onclick="navTo('exam')" id="btn-exam" class="dev-dash-btn rounded-xl p-6 text-left flex items-center gap-4 group h-full">
                <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <div>
                  <div class="text-lg font-bold text-gray-800">段考成績</div>
                  <div class="text-sm text-gray-500 mt-1">各科成績與分佈落點</div>
                </div>
              </button>
              
              <button onclick="navTo('life')" id="btn-life" class="dev-dash-btn rounded-xl p-6 text-left flex items-center gap-4 group h-full">
                <div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                  <div class="text-lg font-bold text-gray-800">生活計點</div>
                  <div class="text-sm text-gray-500 mt-1">每週日常表現與積分</div>
                </div>
              </button>
          </div>
          
          <!-- Right Column: Memo & Badges -->
          <div class="flex flex-col gap-4">
              <!-- Memo -->
              <div class="dev-glass-card rounded-2xl p-6 flex flex-col h-full">
                  <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                      <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                      備忘錄 (本週目標)
                  </h3>
                  <div class="flex flex-col gap-2 flex-grow">
                      <textarea id="memoInput" rows="4" class="w-full border border-gray-200 rounded-lg bg-white/70 p-3 text-gray-700 text-sm focus:ring-2 focus:ring-blue-400 outline-none resize-none flex-grow" placeholder="在此輸入備忘錄或本週目標..."></textarea>
                      <div class="flex justify-end">
                          <button id="saveMemoBtn" class="bg-[#5c6bc0] hover:bg-[#49559c] disabled:opacity-60 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition">
                              <span id="memoBtnText">儲存備忘錄</span>
                          </button>
                      </div>
                  </div>
              </div>
              
              <!-- Honor Badges (Concept) -->
              <div class="dev-glass-card rounded-2xl p-6 relative overflow-visible">
                  <div class="absolute -right-6 -top-6 opacity-10">
                      <svg class="w-32 h-32 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clip-rule="evenodd"></path></svg>
                  </div>
                  <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2 relative z-10">
                      <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                      榮譽徽章解鎖區 <span class="text-xs text-gray-400 font-normal ml-2 bg-white px-2 py-0.5 rounded-full border border-gray-100 shadow-sm">此為概念示意圖，未來可串接積分系統</span>
                  </h3>
                  <div class="flex gap-3 relative z-10">
                      <div class="flex flex-col items-center gap-1 opacity-100">
                          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-200 to-amber-500 flex items-center justify-center text-white shadow-md border-2 border-white">
                              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                          </div>
                          <span class="text-[10px] font-bold text-gray-600">全勤勇者</span>
                      </div>
                      <div class="flex flex-col items-center gap-1 opacity-100">
                          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-slate-200 to-slate-400 flex items-center justify-center text-white shadow-md border-2 border-white">
                              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                          </div>
                          <span class="text-[10px] font-bold text-gray-600">破百積分</span>
                      </div>
                      <div class="flex flex-col items-center gap-1 opacity-40 grayscale">
                          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-emerald-300 to-emerald-600 flex items-center justify-center text-white shadow-sm border-2 border-gray-100">
                              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                          </div>
                          <span class="text-[10px] font-bold text-gray-500">未解鎖</span>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 3. 段考成績專頁 (Exam Details) -->
    <!-- ============================================== -->
    <div id="view-exam" class="dev-hidden space-y-6">
      <button onclick="navTo('dashboard')" class="px-4 py-2 bg-white/80 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        返回主畫面
      </button>
      
      <div class="dev-glass-card rounded-2xl p-6">
        <div class="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-6">
          <div>
            <h3 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                段考成績
            </h3>
            <p class="text-sm text-gray-500 mt-1">請選擇要查詢的段考</p>
          </div>
          <select id="examSelector" class="px-4 py-2 border border-gray-300 rounded-lg font-bold text-gray-700 bg-white w-full md:w-auto shadow-sm">
          </select>
        </div>
        
        <div id="examLoader" class="flex flex-col items-center justify-center py-12 dev-hidden">
            <div class="loader !border-blue-200 !border-t-blue-600 w-10 h-10 mb-3"></div>
            <div class="text-gray-500 font-bold">成績載入中...</div>
        </div>

        <div id="examContent">
          <!-- 4 卡片並排 -->
          <div class="grid grid-cols-4 gap-2 md:gap-4 mb-6">
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-emerald-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">班級排名</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardRank">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-orange-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">校排(估)</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardSchoolRank">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-indigo-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">總平均</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardAvg">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-yellow-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">總分</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardTotal">-</div>
              </div>
          </div>

          <!-- 圖表切換 -->
          <div class="flex justify-end mb-2">
              <div class="inline-flex bg-gray-100 rounded-lg p-1 border border-gray-200">
                  <button id="toggleChartClass" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800">班級分佈</button>
                  <button id="toggleChartSchool" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800">全校分佈</button>
              </div>
          </div>

          <!-- 成績表 -->
          <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white/90 shadow-sm">
              <table class="w-full text-left border-collapse min-w-[600px]">
                  <thead class="bg-gray-50/80 text-gray-600 text-sm border-b border-gray-200">
                      <tr>
                          <th class="p-3 font-bold w-1/5 text-center">科目</th>
                          <th class="p-3 text-center font-bold w-1/5">您的分數</th>
                          <th class="p-3 text-center font-bold w-1/5" id="avgHeaderTitle">班級平均</th>
                          <th class="p-3 font-bold w-[35%]">分佈落點 (<span id="chartTypeLabel">班級</span>)</th>
                      </tr>
                  </thead>
                  <tbody id="examTableBody" class="divide-y divide-gray-100">
                      <!-- JS 渲染 -->
                  </tbody>
              </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 4. 生活計點專頁 (Life Points Details) -->
    <!-- ============================================== -->
    <div id="view-life" class="dev-hidden space-y-6">
      <button onclick="navTo('dashboard')" class="px-4 py-2 bg-white/80 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200 flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        返回主畫面
      </button>
      
      <div class="dev-glass-card rounded-2xl p-0 overflow-hidden">
          <div class="bg-gradient-to-r from-[#f0fdf4] to-white/50 border-l-[6px] border-emerald-500 p-6 flex flex-row items-center gap-6 shadow-sm border-b border-gray-100">
              <div>
                  <div class="text-emerald-800 text-sm font-bold mb-1">總積分</div>
                  <div class="text-4xl md:text-5xl font-black text-emerald-600 font-inter"><span id="totalLifePoints">0</span></div>
                  <div class="text-[10px] text-gray-500 mt-1">(初：<span id="initialPoints">0</span>)</div>
              </div>
              <div class="w-px h-12 bg-emerald-200"></div>
              <div class="flex flex-col justify-center">
