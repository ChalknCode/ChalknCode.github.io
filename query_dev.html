<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【測試版】成績查詢系統 - 805 班級網站</title>
  
  <!-- 使用 Tailwind CDN (僅測試版使用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 正式版的樣式 (保留 Header/Footer 等基本設定) -->
  <link href="css/style.css" rel="stylesheet">
  <!-- 測試版專用覆蓋樣式 -->
  <link href="css/style_dev.css" rel="stylesheet">
</head>
<body class="dev-watercolor-bg text-gray-800 font-sans min-h-screen">

  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-white/50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-300 to-blue-300 flex items-center justify-center text-white font-bold text-lg shadow-sm">
            805
          </div>
          <h1 class="text-xl font-bold text-gray-800">805 學生查詢系統 <span class="text-xs bg-red-500 text-white px-2 py-1 rounded-full ml-2">Beta 測試區</span></h1>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 mb-20 md:mb-8" id="app-container">
    
    <!-- ============================================== -->
    <!-- 1. 登入畫面 -->
    <!-- ============================================== -->
    <div id="view-login" class="max-w-md mx-auto mt-10">
      <div class="text-center mb-8">
        <div class="text-5xl mb-4">🔍</div>
        <h2 class="text-2xl font-bold text-gray-800">學生查詢系統 (測試版)</h2>
      </div>
      
      <div class="dev-glass-card rounded-2xl p-6 md:p-8">
        <form id="loginForm" class="space-y-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">班級座號</label>
            <input type="text" id="seatNo" required placeholder="例如：80501" 
                   class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-[#c2516a] focus:ring-1 focus:ring-[#c2516a]">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">身分證字號</label>
            <div class="relative">
              <input type="password" id="idNumber" required placeholder="請輸入完整身分證字號"
                     class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-[#c2516a] focus:ring-1 focus:ring-[#c2516a]">
              <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-xl hover:opacity-70 focus:outline-none">👁️</button>
            </div>
          </div>
          
          <div id="loginError" class="dev-hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100"></div>
          
          <button type="submit" id="loginBtn" class="w-full py-3 px-4 bg-[#c2516a] hover:bg-[#d8768a] text-white rounded-lg font-bold transition-colors">
            登入查詢
          </button>
        </form>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 2. 首頁主儀表板 (Dashboard) -->
    <!-- ============================================== -->
    <div id="view-dashboard" class="dev-hidden space-y-6">
      
      <!-- 學生資訊區 -->
      <div class="dev-glass-card rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center relative overflow-hidden">
        <div class="z-10 w-full">
          <div class="flex justify-between items-start mb-4">
            <h2 class="text-lg font-bold text-gray-800">學生資訊</h2>
            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">已登入</span>
          </div>
          <div class="border-t border-dashed border-gray-200 pt-4 flex flex-wrap gap-x-6 gap-y-2 text-sm">
            <div><span class="text-gray-500">姓名：</span><span id="studentName" class="font-bold text-gray-800 text-base"></span></div>
            <div><span class="text-gray-500">班級：</span><span id="studentClass" class="font-bold text-gray-800 text-base"></span></div>
            <div><span class="text-gray-500">座號：</span><span id="studentSeatNo" class="font-bold text-gray-800 text-base"></span></div>
          </div>
        </div>
      </div>

      <!-- 備忘錄區塊 -->
      <div class="dev-glass-card rounded-2xl p-6">
          <h3 class="font-bold text-gray-800 mb-2">📝 備忘錄 (本週目標)</h3>
          <div class="border border-gray-200 rounded-lg bg-white/50 p-3 text-gray-500 text-sm min-h-[80px]">
              這裡未來可以放學生的目標或聯絡簿記事...
          </div>
      </div>

      <!-- 功能大按鈕 -->
      <h3 class="text-xl font-bold text-gray-800 pt-4">你想查看什麼？</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="navTo('exam')" id="btn-exam" class="dev-dash-btn rounded-xl p-6 text-left flex items-center gap-4 group">
          <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">🎓</div>
          <div>
            <div class="text-lg font-bold text-gray-800">段考成績</div>
            <div class="text-sm text-gray-500 mt-1">各科成績與分佈落點</div>
          </div>
        </button>
        
        <button onclick="navTo('life')" id="btn-life" class="dev-dash-btn rounded-xl p-6 text-left flex items-center gap-4 group">
          <div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">🛡️</div>
          <div>
            <div class="text-lg font-bold text-gray-800">生活計點</div>
            <div class="text-sm text-gray-500 mt-1">每週日常表現與積分</div>
          </div>
        </button>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 3. 段考成績專頁 (Exam Details) -->
    <!-- ============================================== -->
    <div id="view-exam" class="dev-hidden space-y-6">
      <button onclick="navTo('dashboard')" class="px-4 py-2 bg-white/80 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200">← 返回主畫面</button>
      
      <div class="dev-glass-card rounded-2xl p-6">
        <div class="flex flex-col md:flex-row justify-between md:items-end gap-4 mb-6">
          <div>
            <h3 class="text-2xl font-bold text-gray-800">段考成績</h3>
            <p class="text-sm text-gray-500 mt-1">請選擇要查詢的段考</p>
          </div>
          <select id="examSelector" class="px-4 py-2 border border-gray-300 rounded-lg font-bold text-gray-700 bg-white w-full md:w-auto shadow-sm">
          </select>
        </div>
        
        <div id="examContent">
          <!-- 4 卡片並排 -->
          <div class="grid grid-cols-4 gap-2 md:gap-4 mb-6">
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-emerald-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">班級排名</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardRank">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-orange-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">校排(估)</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardSchoolRank">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-indigo-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">總平均</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardAvg">-</div>
              </div>
              <div class="bg-white/90 p-2 md:p-4 rounded-xl shadow-sm border-t-4 border-t-yellow-400 text-center flex flex-col justify-center">
                  <div class="text-[10px] md:text-xs text-gray-500 font-bold mb-1 whitespace-nowrap">總分</div>
                  <div class="text-lg md:text-3xl font-black text-gray-800 leading-none" id="cardTotal">-</div>
              </div>
          </div>

          <!-- 圖表切換 -->
          <div class="flex justify-end mb-2">
              <div class="inline-flex bg-gray-100 rounded-lg p-1 border border-gray-200">
                  <button id="toggleChartClass" class="px-3 py-1.5 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800">班級分佈</button>
                  <button id="toggleChartSchool" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800">全校分佈</button>
              </div>
          </div>

          <!-- 成績表 -->
          <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white/90">
              <table class="w-full text-left border-collapse min-w-[500px]">
                  <thead class="bg-gray-50/80 text-gray-600 text-sm border-b border-gray-200">
                      <tr>
                          <th class="p-3 font-bold w-1/5">科目</th>
                          <th class="p-3 text-center font-bold w-1/5">您的分數</th>
                          <th class="p-3 text-center font-bold w-1/5" id="avgHeaderTitle">班平</th>
                          <th class="p-3 font-bold w-2/5">分佈落點 (<span id="chartTypeLabel">班級</span>)</th>
                      </tr>
                  </thead>
                  <tbody id="examTableBody" class="divide-y divide-gray-100">
                      <!-- JS 渲染 -->
                  </tbody>
              </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- 4. 生活計點專頁 (Life Points Details) -->
    <!-- ============================================== -->
    <div id="view-life" class="dev-hidden space-y-6">
      <button onclick="navTo('dashboard')" class="px-4 py-2 bg-white/80 hover:bg-white rounded-full text-sm font-bold text-gray-700 shadow-sm border border-gray-200">← 返回主畫面</button>
      
      <div class="dev-glass-card rounded-2xl p-0 overflow-hidden">
          <div class="bg-gradient-to-r from-[#f0fdf4] to-white/50 border-l-[6px] border-emerald-500 p-6 flex flex-row items-center gap-6 shadow-sm border-b border-gray-100">
              <div>
                  <div class="text-emerald-800 text-sm font-bold mb-1">總積分</div>
                  <div class="text-4xl md:text-5xl font-black text-emerald-600"><span id="totalLifePoints">0</span></div>
                  <div class="text-[10px] text-gray-500 mt-1">(初：<span id="initialPoints">0</span>)</div>
              </div>
              <div class="w-px h-12 bg-emerald-200"></div>
              <div class="flex flex-col justify-center">
                  <div class="text-emerald-800 text-sm font-bold mb-1">班級排名</div>
                  <div class="flex items-end gap-3 mb-1">
                      <div class="text-3xl md:text-4xl font-black text-gray-800"><span id="lpRank">-</span></div>
                  </div>
                  <div class="flex gap-2 text-[10px]">
                      <span class="bg-white/80 px-1.5 py-0.5 rounded border border-emerald-100 text-gray-600">前一: <b class="text-gray-800" id="lpPrev">-</b></span>
                      <span class="bg-white/80 px-1.5 py-0.5 rounded border border-rose-100 text-gray-600">後一: <b class="text-rose-600" id="lpNext">-</b></span>
                  </div>
              </div>
          </div>

          <div class="p-6">
              <h4 class="font-bold text-gray-800 mb-4 border-b pb-2">每週生活表現紀錄</h4>
              <div id="lifePointsList" class="space-y-4">
                  <!-- JS 渲染手風琴結構 -->
              </div>
          </div>
      </div>
    </div>

  </main>

  <!-- 測試環境專用腳本 -->
  <script src="js/config.js"></script>
  <script src="js/query_dev.js"></script>
</body>
</html>
