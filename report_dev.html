<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>805 週報表產生器（支援 1~4 週多週整合＆當週累計總積分）</title>
    <link rel="icon" href="images/logo.png" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700;900&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/config.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        comfortaa: ['"Comfortaa"', '"Noto Sans TC"', 'sans-serif'],
                        raleway: ['"Raleway"', 'sans-serif'],
                        handwriting: ['"LXGW WenKai TC"', 'cursive', 'sans-serif'], 
                    },
                    colors: { 'text-main': '#111827', 'text-light': '#4b5563' }
                }
            }
        }
    </script>
    
    <style>
        body { color: #111827; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #fca5a5; border-radius: 10px; }
        .bg-cute-pattern { background-color: #fff9f0; background-image: radial-gradient(#fecaca 1.5px, transparent 1.5px); background-size: 24px 24px; }
        #global-loader { backdrop-filter: blur(4px); transition: opacity 0.3s; }
        
        .report-page { 
            background-color: #ffffff; 
            height: auto; 
            padding: 26px 36px 38px 36px; 
            box-sizing: border-box; 
            display: block; 
            transform-origin: top left; 
            width: 971px; 
        }
        .layout-landscape { min-height: 688px; }
        .layout-portrait { min-height: 1371px; }

        .page-break { page-break-after: always; clear: both; }

        /* ================================================================ */
        /* 🏆 終極防裁切與防白邊系統 (Box-in-Box 背景同色法) */
        /* ================================================================ */
        
        .box-wrapper {
            background-color: #94a3b8;
            padding: 2px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        
        .box-inner {
            background-color: #f3f4f6;
            border-radius: 6px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .box-body {
            background-color: #ffffff;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 12px;
        }

        .record-table { 
            width: 100%; 
            table-layout: fixed; 
            border-collapse: collapse; 
        }
        .record-table th, .record-table td {
            border-right: 1px solid #94a3b8; 
            border-bottom: 1px solid #94a3b8;
        }
        .record-table th { 
            border-bottom: 2px solid #94a3b8; 
            padding: 0; 
        }
        .record-table td { 
            background-color: #ffffff; 
            padding: 7px 8px;
            vertical-align: top !important;
            height: 36px; 
        }
        .record-table th:last-child, .record-table td:last-child { border-right: none; }
        .record-table tr:last-child td { border-bottom: none; }

        /* ================================================================ */

        .record-item { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; line-height: 1.35; align-items: flex-start; }
        .record-item .desc { width: 80%; text-align: left; }
        .record-item .score { width: 20%; text-align: right; font-family: 'Comfortaa', sans-serif; font-weight: 700; }
        
        .theme-bw .info-card { background-color: #f3f4f6; border: 2px solid #374151; color: #111827; border-radius: 8px; box-shadow: 3px 3px 0px rgba(55, 65, 81, 0.2); }
        .theme-bw .stat-box { border: 2px dashed #9ca3af; background-color: #ffffff; border-radius: 6px; }
        .theme-bw .stat-box-total { border: 2px solid #374151; background-color: #f3f4f6; }

        /* 多週合併時每一週的區塊外框 */
        .week-section-block {
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px 10px 12px;
            background-color: #fafaf9;
            margin-bottom: 10px;
        }
        /* 3~4 週超緊湊模式 */
        .week-section-block.ultra-compact {
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .week-section-block.ultra-compact .record-table td {
            padding: 5px 7px;
            height: 28px;
        }
        
        .loader { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .exporting-pdf .adjust-baseline {
            position: relative;
        }

        @media print {
            @page { margin: 10mm; }
            body { margin: 0; padding: 0; background: white !important; }
            #app-ui, #global-loader, .no-print { display: none !important; }
            #print-area { display: block !important; width: 100%; position: static !important; left: auto !important; }
            .report-page { 
                width: 971px !important; 
                max-width: 971px !important;
                min-height: auto !important; 
                height: auto !important;
                padding: 26px 36px 38px 36px !important; 
                box-shadow: none !important; 
                margin: 0 auto !important;
                transform: none !important; 
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden bg-orange-50/30 relative">

    <div id="global-loader" onclick="if(!window.isExporting) this.style.display='none'" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center cursor-pointer" style="display:none;">
        <div class="loader w-12 h-12 mb-4 border-4 !border-orange-200 !border-t-orange-600"></div>
        <div class="text-orange-600 font-bold tracking-widest text-center">
            <span id="loader-text" class="animate-pulse text-lg">正在同步原始資料與學期設定中...</span><br>
            <span id="loader-hint" class="text-[11px] text-gray-500 mt-3 block font-normal px-4 py-1.5 bg-orange-50 rounded-full border border-orange-100">💡 提示：若卡住轉圈圈，點擊畫面任意處即可強制關閉</span>
        </div>
    </div>

    <!-- UI 主畫面 -->
    <div id="app-ui" class="flex flex-col md:flex-row w-full h-full print:hidden">
        
        <!-- 左側面板（縮小寬度至 310~340px，讓右側預覽空間更大） -->
        <div class="w-full md:w-[310px] lg:w-[340px] flex-shrink-0 bg-white/95 backdrop-blur-md border-r border-orange-100 shadow-2xl z-20 flex flex-col h-full overflow-y-auto relative rounded-r-[1.75rem] custom-scrollbar">
            <div class="p-4 bg-gradient-to-br from-rose-400 to-orange-400 text-white sticky top-0 z-10 shadow-sm rounded-br-[1.75rem]">
                <div class="flex items-center justify-between gap-1">
                    <h1 class="text-lg font-bold tracking-wider font-comfortaa flex items-center gap-1.5 whitespace-nowrap">
                        <span class="iconify text-xl" data-icon="ph:magic-wand-fill"></span>805 週報表產生器
                    </h1>
                    <span id="data-source-badge" class="text-[10px] bg-white/25 px-2 py-0.5 rounded-full font-bold backdrop-blur-sm whitespace-nowrap">✨ 預覽示範模式</span>
                </div>
                <p class="text-[11px] text-white/90 mt-1 font-medium">支援「1～4 週自由整合」＋「各週獨立截止總積分」✨</p>
            </div>

            <div class="p-3.5 space-y-3.5 flex-1">
                <!-- 🌟 步驟 1：選擇一次要出幾週（1 週 / 2 週 / 3 週 / 4 週）＋ 分頁排版模式 -->
                <div class="bg-rose-50/70 p-3 rounded-2xl border border-rose-200/70 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-rose-900 flex items-center gap-1">
                            <span class="iconify text-sm" data-icon="ph:calendar-plus-duotone"></span> 1. 本次要一次產出幾週？
                        </label>
                        <span class="text-[10px] text-rose-600 font-bold">最多 4 週</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1">
                        <button type="button" data-week-count="1" class="week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-white text-slate-600 border-rose-200">1 週</button>
                        <button type="button" data-week-count="2" class="week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-white text-slate-600 border-rose-200">2 週</button>
                        <button type="button" data-week-count="3" class="week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-white text-slate-600 border-rose-200">3 週</button>
                        <button type="button" data-week-count="4" class="week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-rose-500 text-white border-rose-500 shadow-sm">4 週</button>
                    </div>

                    <div id="multi-page-mode-wrap" class="space-y-1.5 pt-1 border-t border-rose-200/60">
                        <label class="block text-xs font-bold text-rose-900 flex items-center gap-1">
                            <span class="iconify text-sm" data-icon="ph:files-duotone"></span> 2. 多週排版與分頁方式
                        </label>
                        <div class="grid grid-cols-3 gap-1">
                            <button type="button" data-page-mode="all_in_one" class="page-mode-btn px-1 py-1.5 rounded-xl text-[10px] font-bold border transition bg-rose-500 text-white border-rose-500 shadow-sm">
                                📜 全部同張<br><span class="text-[9px] font-normal opacity-90">(共用簽名欄)</span>
                            </button>
                            <button type="button" data-page-mode="two_per_page" class="page-mode-btn px-1 py-1.5 rounded-xl text-[10px] font-bold border transition bg-white text-slate-600 border-rose-200">
                                📑 每2週一張<br><span class="text-[9px] font-normal opacity-80">(4週分2張)</span>
                            </button>
                            <button type="button" data-page-mode="one_per_page" class="page-mode-btn px-1 py-1.5 rounded-xl text-[10px] font-bold border transition bg-white text-slate-600 border-rose-200">
                                🗂️ 每1週一張<br><span class="text-[9px] font-normal opacity-80">(批次出多張)</span>
                            </button>
                        </div>
                    </div>

                    <p id="week-mode-desc" class="text-[10.5px] text-rose-800 leading-relaxed bg-white/85 px-2.5 py-1.5 rounded-xl border border-rose-100"></p>
                </div>

                <!-- 基本設定（起始週次 ＋ 自動展開各週日期區間） -->
                <div class="bg-orange-50/50 p-3 rounded-2xl border border-orange-100/50 space-y-2.5">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-orange-800">學期與起始週次設定</label>
                        <button id="btn-refresh-data" class="text-[10px] bg-orange-200 text-orange-900 hover:bg-orange-300 px-2 py-1 rounded-lg font-bold transition flex items-center gap-1">
                            <span class="iconify" data-icon="ph:arrows-clockwise-bold"></span> 重載試算表
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-orange-700 mb-1">學期</label>
                            <select id="input-semester" class="w-full px-2 py-1.5 border border-orange-200 rounded-xl bg-white text-xs font-bold shadow-sm cursor-pointer outline-none focus:ring-2 focus:ring-orange-400/50">
                                <option value="114學年度第1學期">114學年度第1學期</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-orange-700 mb-1">起始週次</label>
                            <input type="text" id="input-start-week" value="第 7 週" class="w-full px-2 py-1.5 border border-orange-200 rounded-xl bg-white text-xs font-bold shadow-sm outline-none focus:ring-2 focus:ring-orange-400/50 text-center">
                        </div>
                    </div>

                    <!-- 動態產生的各週日期列表 -->
                    <div id="week-ranges-list" class="space-y-1.5 max-h-52 overflow-y-auto pr-1 custom-scrollbar"></div>
                </div>

                <!-- 每日備註/放假設定（支援切換目前選取的任一週） -->
                <div class="bg-red-50/50 p-3 rounded-2xl border border-red-100/50 space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold text-red-800 flex items-center gap-1">
                            <span class="iconify" data-icon="ph:calendar-star-duotone"></span> 每日備註 / 放假設定
                        </label>
                        <span id="save-status-class" class="text-[10px] font-bold opacity-0 transition"></span>
                    </div>
                    <!-- 切換要編輯哪一週的放假備註 -->
                    <div id="day-note-week-tabs" class="flex flex-wrap gap-1"></div>

                    <div class="grid grid-cols-5 gap-1 pt-0.5">
                        <div class="text-center"><div class="text-[10px] text-slate-500 mb-0.5">一</div><input type="text" id="note-day-1" placeholder="正常" class="w-full px-1 py-1 text-center text-xs border border-red-200 rounded focus:outline-none focus:ring-1 focus:ring-red-400 bg-white"></div>
                        <div class="text-center"><div class="text-[10px] text-slate-500 mb-0.5">二</div><input type="text" id="note-day-2" placeholder="正常" class="w-full px-1 py-1 text-center text-xs border border-red-200 rounded focus:outline-none focus:ring-1 focus:ring-red-400 bg-white"></div>
                        <div class="text-center"><div class="text-[10px] text-slate-500 mb-0.5">三</div><input type="text" id="note-day-3" placeholder="正常" class="w-full px-1 py-1 text-center text-xs border border-red-200 rounded focus:outline-none focus:ring-1 focus:ring-red-400 bg-white"></div>
                        <div class="text-center"><div class="text-[10px] text-slate-500 mb-0.5">四</div><input type="text" id="note-day-4" placeholder="正常" class="w-full px-1 py-1 text-center text-xs border border-red-200 rounded focus:outline-none focus:ring-1 focus:ring-red-400 bg-white"></div>
                        <div class="text-center"><div class="text-[10px] text-slate-500 mb-0.5">五</div><input type="text" id="note-day-5" placeholder="正常" class="w-full px-1 py-1 text-center text-xs border border-red-200 rounded focus:outline-none focus:ring-1 focus:ring-red-400 bg-white"></div>
                    </div>
                </div>

                <!-- 選擇學生 -->
                <div class="bg-gradient-to-br from-teal-50 to-emerald-50 p-3 rounded-2xl border border-teal-100 shadow-sm">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-teal-800">選擇學生</label>
                        <button id="btn-open-edit" class="text-[10px] bg-teal-600 text-white hover:bg-teal-700 px-2.5 py-1 rounded-lg font-bold transition flex items-center gap-1 shadow-sm">
                            <span class="iconify" data-icon="ph:pencil-simple-duotone"></span> 微調各週資料
                        </button>
                    </div>
                    <select id="input-seat" class="w-full px-2.5 py-1.5 border border-teal-200 rounded-xl bg-white text-xs font-bold text-teal-900 cursor-pointer shadow-sm outline-none focus:ring-2 focus:ring-teal-400/50"></select>
                </div>

                <!-- 版面與比例設定 -->
                <div class="bg-indigo-50/50 p-3 rounded-2xl border border-indigo-100/50 space-y-2.5">
                    <label class="block text-xs font-bold text-indigo-800 flex items-center gap-1"><span class="iconify" data-icon="ph:layout-duotone"></span> 版面與產出模式設定</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-indigo-600 mb-1">產出模式 (決定 PDF 大小)</label>
                            <select id="input-export-mode" class="w-full px-2.5 py-1.5 border border-indigo-200 rounded-xl text-xs font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-400 bg-white cursor-pointer shadow-sm">
                                <option value="dynamic_pdf">⬇️ 自適應下載 (有多長存多長)</option>
                                <option value="native_print">🖨️ 傳統列印 (自動縮放符合紙張)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-indigo-600 mb-1">預覽畫布佈局</label>
                            <select id="input-orientation" class="w-full px-2 py-1.5 border border-indigo-200 rounded-xl text-xs font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-400 bg-white cursor-pointer shadow-sm">
                                <option value="landscape">一般橫向佈局</option>
                                <option value="portrait">加長直向佈局</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-indigo-600 mb-1">簽名區模式</label>
                            <select id="input-signature-layout" class="w-full px-2 py-1.5 border border-indigo-200 rounded-xl text-xs font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-400 bg-white cursor-pointer shadow-sm">
                                <option value="row">橫向並排</option>
                                <option value="stacked">右側堆疊</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mt-2">
                        <label class="block text-[10px] font-bold text-indigo-600 mb-1">簽名區比例 (師:生:家)</label>
                        <div class="flex gap-1.5 items-center">
                            <input type="number" id="input-flex-teacher" value="45" class="w-full px-1.5 py-1 border border-indigo-200 rounded-lg text-center text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm">
                            <span class="text-indigo-300">:</span>
                            <input type="number" id="input-flex-student" value="25" class="w-full px-1.5 py-1 border border-indigo-200 rounded-lg text-center text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm">
                            <span class="text-indigo-300">:</span>
                            <input type="number" id="input-flex-parent" value="30" class="w-full px-1.5 py-1 border border-indigo-200 rounded-lg text-center text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <div>
                            <label class="block text-[10px] font-bold text-indigo-600 mb-1">簽名區總高度 (PX)</label>
                            <div class="flex items-center">
                                <input type="number" id="input-signature-height" value="140" min="50" max="400" step="10" class="w-full px-2 py-1 border border-indigo-200 rounded-lg text-center text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-indigo-400 shadow-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-rose-600 mb-1">PDF 下沉校正 (PX)</label>
                            <div class="flex items-center">
                                <input type="number" id="input-pdf-offset" value="2" min="0" max="10" step="1" class="w-full px-2 py-1 border border-rose-200 text-rose-700 rounded-lg text-center text-xs font-bold bg-white outline-none focus:ring-2 focus:ring-rose-400 shadow-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2 pb-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-600">導師的話（班級宣導＆個人評語）</span>
                        <span id="save-status-personal" class="text-[10px] font-bold opacity-0 transition"></span>
                    </div>
                    <textarea id="input-class-comment" rows="2" placeholder="班級宣導..." class="w-full p-2.5 border border-indigo-200 rounded-xl font-handwriting text-sm text-slate-800 bg-white focus:ring-2 focus:ring-indigo-400 outline-none"></textarea>
                    <textarea id="input-comment" rows="2" placeholder="個人評語..." class="w-full p-2.5 border border-rose-200 rounded-xl font-handwriting text-sm text-slate-800 bg-white focus:ring-2 focus:ring-rose-400 outline-none"></textarea>
                </div>
            </div>

            <div class="p-3.5 bg-white/90 border-t border-rose-50 space-y-2 sticky bottom-0 z-10 rounded-tr-[1.75rem]">
                <button id="btn-download-single" class="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white text-sm font-bold rounded-full shadow-md transition flex justify-center items-center">
                    <span class="iconify text-lg mr-1" data-icon="ph:download-simple-bold"></span> <span id="btn-single-label">執行產出 (單人 4 週報表)</span>
                </button>
                <button id="btn-download-all" class="w-full py-2.5 bg-teal-500 hover:bg-teal-600 text-white text-sm font-bold rounded-full shadow-md transition flex justify-center items-center">
                    <span class="iconify text-lg mr-1" data-icon="ph:files-bold"></span> <span id="btn-all-label">執行產出 (全班批次)</span>
                </button>
            </div>
        </div>

        <!-- 右側：即時預覽區 -->
        <div class="flex-1 bg-cute-pattern h-full overflow-auto p-4 md:p-8 flex flex-col items-center justify-start relative">
            <!-- 當分頁模式為「每2週一張」或「每1週一張」時，頂部顯示預覽頁切換器 -->
            <div id="preview-page-switcher" class="hidden mb-4 bg-white/95 px-4 py-2 rounded-full shadow-md border border-rose-200 flex items-center gap-2 z-20">
                <span class="text-xs font-bold text-slate-600">📄 切換預覽分頁：</span>
                <div id="preview-page-btns" class="flex gap-1.5"></div>
            </div>

            <div id="preview-scale-wrapper" class="relative" style="transform-origin: top center; transition: transform 0.2s;">
                <div class="absolute inset-0 bg-black/5 blur-xl rounded-sm transform translate-y-4 translate-x-2 pointer-events-none"></div>

<script>
    // 🏆 全域狀態與多週資料庫（支援 1 ～ 4 週動態擴充）
    window.isExporting = false;
    let selectedWeekCount = 4;          // 1 | 2 | 3 | 4（預設展示 4 週一起出的效果！）
    let pageSplitMode = 'all_in_one';   // 'all_in_one' (全部同張) | 'two_per_page' (每2週一張) | 'one_per_page' (每1週一張)
    let activeChunkIndex = 0;           // 分頁預覽時目前看第幾張
    let activeDayNoteWeekIdx = 0;       // 左側「每日備註」目前正在編輯哪一週 (0..selectedWeekCount-1)

    let globalSemesterList = [
        { name: '114學年度第1學期', isActive: true, startDate: new Date(2026, 8, 7).getTime() } // 2026-09-07 第一週週一
    ];

    // weeksList 儲存每一週的完整狀態：[{ weekLabel, startDate, endDate, dayNotes, students, netScores }]
    let weeksList = [];
    let tempEditRecordsByWeek = [];

    function getEl(id) { return document.getElementById(id); }
    const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function toIsoDate(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatShortDate(ds) {
        if (!ds) return '--/--';
        const parts = ds.split('-');
        if (parts.length < 3) return ds;
        return `${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
    }

    /* ============ 1. 內建 4 週示範資料（展現第 7、8、9、10 週各自獨立推進的「當週結算總分」） ============ */
    function initDemoWeeksData(startWeekNum, count) {
        const demoRoster = [
            { seatNo: '1', name: '林宥辰', baseScore: 100 },
            { seatNo: '2', name: '陳品言', baseScore: 100 },
            { seatNo: '3', name: '張宇翔', baseScore: 100 },
            { seatNo: '4', name: '黃子軒', baseScore: 100 },
            { seatNo: '5', name: '李承恩', baseScore: 100 },
            { seatNo: '6', name: '王宥翔', baseScore: 100 },
            { seatNo: '7', name: '吳冠廷', baseScore: 100 },
            { seatNo: '8', name: '劉品希', baseScore: 100 }
        ];

        // 4 個示範週的每日紀錄模板
        const demoRecordsPerWeek = [
            // Week offset 0 (例如第 7 週)
            {
                dayNotes: { 1: '', 2: '', 3: '', 4: '', 5: '', classComment: '本月份週報表彙整了近幾週的生活常規與聯絡簿表現，請家長參閱並簽名！' },
                recs: {
                    '1': { 1: [], 2: [{ reason: '早自習秩序優良', points: 1, remarks: '' }], 3: [], 4: [], 5: [] },
                    '2': { 1: [{ reason: '聯絡簿家長未簽名', points: -1, remarks: '' }], 2: [], 3: [], 4: [], 5: [] },
                    '3': { 1: [], 2: [{ reason: '聯絡簿未交', points: -1, remarks: '' }], 3: [], 4: [{ reason: '聯絡簿遲交', points: -0.5, remarks: '' }], 5: [] },
                    '5': { 1: [], 2: [], 3: [{ reason: '打掃工作認真', points: 1, remarks: '' }], 4: [], 5: [] },
                    '7': { 1: [{ reason: '聯絡簿未交', points: -1, remarks: '' }], 2: [], 3: [], 4: [], 5: [] },
                    '8': { 1: [{ reason: '聯絡簿書寫優良', points: 1, remarks: '' }], 2: [], 3: [], 4: [{ reason: '熱心班級事務', points: 1, remarks: '' }], 5: [] }
                }
            },
            // Week offset 1 (例如第 8 週)
            {
                dayNotes: { 1: '校慶補假', 2: '', 3: '', 4: '', 5: '' },
                recs: {
                    '1': { 1: [], 2: [], 3: [{ reason: '抽屜座位整潔優良', points: 1, remarks: '' }], 4: [], 5: [] },
                    '2': { 1: [], 2: [], 3: [{ reason: '聯絡簿書寫優良', points: 1, remarks: '札記用心' }], 4: [], 5: [] },
                    '3': { 1: [], 2: [], 3: [{ reason: '週報表未交', points: -1, remarks: '' }], 4: [], 5: [{ reason: '打掃工作認真', points: 1, remarks: '' }] },
                    '5': { 1: [], 2: [{ reason: '聯絡簿札記未寫', points: -1, remarks: '' }], 3: [], 4: [], 5: [] },
                    '7': { 1: [], 2: [{ reason: '作業未交／遲交', points: -1, remarks: '英習' }], 3: [], 4: [], 5: [] },
                    '8': { 1: [], 2: [], 3: [], 4: [{ reason: '打掃工作認真', points: 1, remarks: '' }], 5: [] }
                }
            },
            // Week offset 2 (例如第 9 週)
            {
                dayNotes: { 1: '', 2: '', 3: '', 4: '', 5: '' },
                recs: {
                    '1': { 1: [{ reason: '早自習秩序優良', points: 1, remarks: '' }], 2: [], 3: [{ reason: '熱心班級事務', points: 1, remarks: '搬運器材' }], 4: [], 5: [] },
                    '2': { 1: [], 2: [{ reason: '聯絡簿家長未簽名', points: -1, remarks: '' }], 3: [], 4: [{ reason: '聯絡簿書寫優良', points: 1, remarks: '' }], 5: [] },
                    '3': { 1: [{ reason: '聯絡簿未交', points: -1, remarks: '' }], 2: [], 3: [{ reason: '作業未交／遲交', points: -1, remarks: '數習' }], 4: [{ reason: '打掃工作認真', points: 1, remarks: '' }], 5: [] },
                    '5': { 1: [], 2: [], 3: [{ reason: '聯絡簿札記未寫', points: -1, remarks: '' }], 4: [], 5: [] },
                    '7': { 1: [{ reason: '服儀／物品未帶', points: -1, remarks: '' }], 2: [{ reason: '聯絡簿未交', points: -1, remarks: '' }], 3: [], 4: [], 5: [] },
                    '8': { 1: [], 2: [{ reason: '聯絡簿書寫優良', points: 1, remarks: '' }], 3: [], 4: [{ reason: '抽屜座位整潔優良', points: 1, remarks: '' }], 5: [] }
                }
            },
            // Week offset 3 (例如第 10 週)
            {
                dayNotes: { 1: '', 2: '', 3: '', 4: '', 5: '運動會補假' },
                recs: {
                    '1': { 1: [], 2: [{ reason: '聯絡簿書寫優良', points: 1, remarks: '' }], 3: [], 4: [{ reason: '打掃工作認真', points: 1, remarks: '' }], 5: [] },
                    '2': { 1: [{ reason: '打掃工作認真', points: 1, remarks: '' }], 2: [], 3: [], 4: [], 5: [] },
                    '3': { 1: [], 2: [{ reason: '聯絡簿遲交', points: -0.5, remarks: '第一節補交' }], 3: [], 4: [{ reason: '聯絡簿未交', points: -1, remarks: '' }, { reason: '週報表未交', points: -1, remarks: '' }], 5: [] },
                    '5': { 1: [{ reason: '聯絡簿家長未簽名', points: -1, remarks: '' }], 2: [], 3: [], 4: [{ reason: '熱心班級事務', points: 1, remarks: '' }], 5: [] },
                    '7': { 1: [], 2: [], 3: [{ reason: '聯絡簿家長未簽名', points: -1, remarks: '' }], 4: [], 5: [] },
                    '8': { 1: [{ reason: '熱心班級事務', points: 1, remarks: '' }], 2: [], 3: [{ reason: '早自習秩序優良', points: 1, remarks: '' }], 4: [], 5: [] }
                }
            }
        ];

        const demoComments = {
            '1': '宥辰這幾週表現非常穩定，常主動幫忙班務，繼續保持！',
            '2': '品言近期聯絡簿簽名與札記越來越穩定，進步看得見！',
            '3': '宇翔這幾週聯絡簿與作業較常遲交或未交，請養成睡前檢查書包的好習慣喔！'
        };

        const semStartMs = (globalSemesterList[0] && globalSemesterList[0].startDate) || new Date(2026, 8, 7).getTime();
        const runningScoreMap = {};
        demoRoster.forEach(s => { runningScoreMap[s.seatNo] = s.baseScore; });

        weeksList = [];
        for (let idx = 0; idx < count; idx++) {
            const wNum = startWeekNum + idx;
            const mon = new Date(semStartMs);
            mon.setDate(mon.getDate() + (wNum - 1) * 7);
            const sun = new Date(mon);
            sun.setDate(mon.getDate() + 6);

            const tpl = demoRecordsPerWeek[idx % demoRecordsPerWeek.length];
            const studentsMap = {};

            demoRoster.forEach(stu => {
                const rawR = (tpl.recs && tpl.recs[stu.seatNo]) || { 1: [], 2: [], 3: [], 4: [], 5: [] };
                const rCopy = { 1: [], 2: [], 3: [], 4: [], 5: [] };
                let weekDelta = 0;
                for (let d = 1; d <= 5; d++) {
                    rCopy[d] = (rawR[d] || []).map(item => {
                        weekDelta += item.points;
                        return Object.assign({}, item);
                    });
                }
                // ★ 每一週的 totalScore 都是累加至「該週末」的當週結算總分！
                runningScoreMap[stu.seatNo] = parseFloat((runningScoreMap[stu.seatNo] + weekDelta).toFixed(1));

                studentsMap[stu.seatNo] = {
                    seatNo: stu.seatNo,
                    name: stu.name,
                    totalScore: runningScoreMap[stu.seatNo],
                    records: rCopy,
                    comment: demoComments[stu.seatNo] || ''
                };
            });

            const wObj = {
                weekLabel: `第 ${wNum} 週`,
                startDate: toIsoDate(mon),
                endDate: toIsoDate(sun),
                dayNotes: Object.assign({ 1: '', 2: '', 3: '', 4: '', 5: '' }, tpl.dayNotes),
                students: studentsMap,
                netScores: {}
            };
            recalculateNetScores(wObj);
            weeksList.push(wObj);
        }
    }

    function recalculateNetScores(wState) {
        wState.netScores = {};
        Object.keys(wState.students).forEach(seat => {
            const student = wState.students[seat];
            let p = 0, m = 0;
            Object.values(student.records || {}).forEach(dayArr => {
                (dayArr || []).forEach(r => {
                    if (r.points > 0) p += r.points;
                    else m += Math.abs(r.points);
                });
            });
            wState.netScores[seat] = parseFloat((p - m).toFixed(1));
        });
    }

    /* ============ 2. 連線後端（支援一次抓取 N 週資料） ============ */
    async function callBackendAPI(action, payload) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            return new Promise((resolve, reject) => {
                const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
                if (action === 'getMultiWeekReportData') runner.getMultiWeekReportData(payload.ranges, payload.semesterName, payload.startWeekNum, payload.weekCount);
                else if (action === 'getCompleteReportData') runner.getCompleteReportData(payload.startDateStr, payload.endDateStr, payload.semesterName);
                else if (action === 'saveWeekDayNotes') runner.saveWeekDayNotes(payload.semester, payload.week, payload.notesObj);
                else if (action === 'saveWeeklyComment') runner.saveWeeklyComment(payload.semester, payload.week, payload.seatNo, payload.studentName, payload.comment);
                else resolve(null);
            });
        }
        if (typeof CONFIG !== 'undefined' && CONFIG.API_URL) {
            const resp = await fetch(CONFIG.API_URL, {
                method: 'POST',
                body: JSON.stringify(Object.assign({ action: action }, payload))
            });
            return await resp.json();
        }
        return null;
    }

    async function fetchAllData(useStartWeek = true) {
        const loader = getEl('global-loader');
        if (loader) loader.style.display = 'flex';

        const semName = getEl('input-semester').value;
        const m = (getEl('input-start-week').value || '').match(/\d+/);
        const startW = m ? parseInt(m[0], 10) : 7;
        const ranges = weeksList.map(w => ({ startDateStr: w.startDate, endDateStr: w.endDate }));

        try {
            const res = await callBackendAPI('getMultiWeekReportData', {
                ranges: ranges,
                semesterName: semName,
                startWeekNum: useStartWeek ? startW : null,
                weekCount: useStartWeek ? selectedWeekCount : null
            });

            if (res && res.success && Array.isArray(res.weeks) && res.weeks.length === weeksList.length) {
                globalSemesterList = res.semesterList || globalSemesterList;
                const semSelect = getEl('input-semester');
                if (semSelect && globalSemesterList.length) {
                    semSelect.innerHTML = '';
                    globalSemesterList.forEach(sem => {
                        const opt = document.createElement('option');
                        opt.value = sem.name; opt.textContent = sem.name;
                        if (sem.name === res.activeSemester) opt.selected = true;
                        semSelect.appendChild(opt);
                    });
                }

                res.weeks.forEach((wRes, idx) => {
                    if (!wRes || !wRes.success) return;
                    weeksList[idx].weekLabel = wRes.currentWeek || weeksList[idx].weekLabel;
                    weeksList[idx].startDate = wRes.startDateStr || weeksList[idx].startDate;
                    weeksList[idx].endDate = wRes.endDateStr || weeksList[idx].endDate;
                    weeksList[idx].dayNotes = wRes.dayNotes || { 1: '', 2: '', 3: '', 4: '', 5: '' };
                    weeksList[idx].students = {};
                    (wRes.students || []).forEach(s => {
                        if (s && s.seatNo) weeksList[idx].students[s.seatNo] = s;
                    });
                    recalculateNetScores(weeksList[idx]);
                });

                const badge = getEl('data-source-badge');
                if (badge) {
                    badge.textContent = '🟢 已連線試算表';
                    badge.className = 'text-[10px] bg-emerald-600/90 text-white px-2 py-0.5 rounded-full font-bold whitespace-nowrap';
                }
            }
        } catch (err) {
            console.warn('目前使用內建預覽示範資料：', err);
        }

        renderWeekRangesListUI();
        renderDayNoteWeekTabs();
        updateSeatDropdown();
        if (loader) loader.style.display = 'none';
    }

    /* ============ 3. 左側各週區間清單 ＆ 每日放假備註頁籤 ============ */
    function renderWeekRangesListUI() {
        const box = getEl('week-ranges-list');
        if (!box) return;
        box.innerHTML = weeksList.map((w, idx) => `
            <div class="bg-white p-2 rounded-xl border border-orange-200/80 space-y-1">
                <div class="flex items-center justify-between">
                    <span class="text-[10.5px] font-extrabold text-orange-800">📅 區段 ${idx + 1}</span>
                    <input type="text" data-wk-label="${idx}" value="${escHtml(w.weekLabel)}" class="w-20 px-1.5 py-0.5 border border-orange-200 rounded-md bg-orange-50/40 text-[11px] font-bold text-center outline-none">
                </div>
                <div class="flex items-center gap-1">
                    <input type="date" data-wk-start="${idx}" value="${w.startDate}" class="w-full min-w-0 px-1.5 py-1 border border-orange-200 rounded-lg text-[11px] outline-none">
                    <span class="text-orange-400 font-bold text-xs">~</span>
                    <input type="date" data-wk-end="${idx}" value="${w.endDate}" class="w-full min-w-0 px-1.5 py-1 border border-orange-200 rounded-lg text-[11px] outline-none">
                </div>
            </div>
        `).join('');

        box.querySelectorAll('[data-wk-label]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const i = Number(e.target.getAttribute('data-wk-label'));
                weeksList[i].weekLabel = e.target.value;
                renderDayNoteWeekTabs();
                updatePreview();
            });
        });
        box.querySelectorAll('[data-wk-start]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const i = Number(e.target.getAttribute('data-wk-start'));
                weeksList[i].startDate = e.target.value;
                fetchAllData(false);
            });
        });
        box.querySelectorAll('[data-wk-end]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const i = Number(e.target.getAttribute('data-wk-end'));
                weeksList[i].endDate = e.target.value;
                fetchAllData(false);
            });
        });
    }

    function renderDayNoteWeekTabs() {
        if (activeDayNoteWeekIdx >= weeksList.length) activeDayNoteWeekIdx = 0;
        const wrap = getEl('day-note-week-tabs');
        if (!wrap) return;
        wrap.innerHTML = weeksList.map((w, idx) => {
            const hasNote = [1, 2, 3, 4, 5].some(d => w.dayNotes && String(w.dayNotes[d] || '').trim() !== '');
            const isAct = idx === activeDayNoteWeekIdx;
            return `<button type="button" data-note-wk="${idx}" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition flex items-center gap-1 ${isAct ? 'bg-red-500 text-white shadow-sm' : 'bg-white text-red-800 border border-red-200'}">
                <span>${escHtml(w.weekLabel)}</span>
                ${hasNote ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-300 inline-block"></span>' : ''}
            </button>`;
        }).join('');

        wrap.querySelectorAll('[data-note-wk]').forEach(btn => {
            btn.addEventListener('click', () => {
                activeDayNoteWeekIdx = Number(btn.getAttribute('data-note-wk'));
                renderDayNoteWeekTabs();
                syncDayNoteInputsFromActiveWeek();
            });
        });

        syncDayNoteInputsFromActiveWeek();
    }

    function syncDayNoteInputsFromActiveWeek() {
        const w = weeksList[activeDayNoteWeekIdx];
        if (!w) return;
        for (let i = 1; i <= 5; i++) {
            if (getEl(`note-day-${i}`)) getEl(`note-day-${i}`).value = (w.dayNotes && w.dayNotes[i]) || '';
        }
        const firstWithCls = weeksList.find(x => x.dayNotes && x.dayNotes.classComment);
        if (getEl('input-class-comment') && !getEl('input-class-comment').value && firstWithCls) {
            getEl('input-class-comment').value = firstWithCls.dayNotes.classComment;
        }
    }

    /* ============ 4. 分頁切片邏輯（全部同張 vs 每2週一張 vs 每1週一張） ============ */
    function getPageChunks() {
        const indices = weeksList.map((_, i) => i);
        if (pageSplitMode === 'all_in_one' || indices.length <= 1) {
            return [indices];
        }
        if (pageSplitMode === 'two_per_page') {
            const chunks = [];
            for (let i = 0; i < indices.length; i += 2) {
                chunks.push(indices.slice(i, i + 2));
            }
            return chunks;
        }
        // 'one_per_page'
        return indices.map(i => [i]);
    }

    function renderPreviewPageSwitcher() {
        const chunks = getPageChunks();
        if (activeChunkIndex >= chunks.length) activeChunkIndex = 0;
        const bar = getEl('preview-page-switcher');
        const btnsBox = getEl('preview-page-btns');

        if (chunks.length <= 1) {
            bar.classList.add('hidden');
            return;
        }
        bar.classList.remove('hidden');
        btnsBox.innerHTML = chunks.map((chunk, cIdx) => {
            const labels = chunk.map(i => weeksList[i].weekLabel).join('＋');
            const isAct = cIdx === activeChunkIndex;
            return `<button type="button" data-chunk-idx="${cIdx}" class="px-3 py-1 rounded-full text-xs font-bold transition ${isAct ? 'bg-rose-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-rose-50'}">
                第 ${cIdx + 1} 張（${escHtml(labels)}）
            </button>`;
        }).join('');

        btnsBox.querySelectorAll('[data-chunk-idx]').forEach(btn => {
            btn.addEventListener('click', () => {
                activeChunkIndex = Number(btn.getAttribute('data-chunk-idx'));
                renderPreviewPageSwitcher();
                updatePreview();
            });
        });
    }

    /* ============ 5. 學生統計與單週區塊 HTML 建構 ============ */
    function updateSeatDropdown() {
        const select = getEl('input-seat');
        if (!select || !weeksList.length) return;

        const currentSelected = select.value;
        select.innerHTML = '';

        const firstWeekStudents = weeksList[0].students || {};
        const seats = Object.keys(firstWeekStudents).sort((a, b) => parseInt(a) - parseInt(b));
        if (seats.length === 0) {
            select.innerHTML = '<option value="">無學生資料</option>';
            updatePreview();
            return;
        }

        seats.forEach(seat => {
            const opt = document.createElement('option');
            opt.value = seat;
            opt.textContent = `${seat}號 - ${firstWeekStudents[seat].name}`;
            select.appendChild(opt);
        });

        if (seats.includes(currentSelected)) select.value = currentSelected;
        else select.value = seats[0];

        loadStudentData();
    }

    function loadStudentData() {
        const seat = getEl('input-seat') ? getEl('input-seat').value : null;
        const lastW = weeksList[weeksList.length - 1];
        const s = (lastW && seat && lastW.students[seat]) ? lastW.students[seat] : null;
        if (getEl('input-comment')) getEl('input-comment').value = (s && s.comment) || '';
        updatePreview();
    }

    function getStudentWeekStats(wState, seat) {
        const s = wState.students[seat];
        if (!s) return { plus: 0, minus: 0, net: 0, weekRank: '--', totalScore: 0, totalRank: '--', hasRecord: false, records: {1:[],2:[],3:[],4:[],5:[]} };

        let p = 0, m = 0, hasRecord = false;
        Object.values(s.records || {}).forEach(dayArr => {
            if (dayArr && dayArr.length > 0) hasRecord = true;
            (dayArr || []).forEach(r => {
                if (r.points > 0) p += r.points;
                else m += Math.abs(r.points);
            });
        });
        p = parseFloat(p.toFixed(1));
        m = parseFloat(m.toFixed(1));
        const net = parseFloat((p - m).toFixed(1));
        const totalScore = parseFloat((s.totalScore || 0).toFixed(1));

        let weekRank = 1;
        const myNet = wState.netScores[seat] ?? net;
        Object.keys(wState.netScores).forEach(otherSeat => {
            if (wState.netScores[otherSeat] > myNet) weekRank++;
        });

        let totalRank = 1;
        Object.values(wState.students).forEach(other => {
            if (other.totalScore > s.totalScore) totalRank++;
        });

        return { plus: p, minus: m, net, weekRank, totalScore, totalRank, hasRecord, records: s.records };
    }

    function buildWeekBlockHTML(wState, seat, weeksOnThisPage) {
        const st = getStudentWeekStats(wState, seat);
        const startD = wState.startDate;
        const endD = wState.endDate;
        const isMulti = weeksOnThisPage >= 2;
        const isUltraCompact = weeksOnThisPage >= 3;

        const dayHeaders = [];
        if (startD) {
            const parts = startD.split('-');
            const sd = new Date(parts[0], parts[1] - 1, parts[2]);
            for (let i = 1; i <= 5; i++) {
                const d = new Date(sd);
                d.setDate(sd.getDate() + (i - 1));
                dayHeaders.push(`${d.getMonth() + 1}/${String(d.getDate()).padStart(2, '0')}`);
            }
        } else {
            for (let i = 1; i <= 5; i++) dayHeaders.push('--/--');
        }

        let rowCells = '<tr>';
        for (let i = 1; i <= 5; i++) {
            rowCells += '<td>';
            if (wState.dayNotes[i] && String(wState.dayNotes[i]).trim() !== '') {
                rowCells += `<div class="w-full mb-1.5 mt-0.5 bg-red-50 rounded border border-red-100" style="display: table;">
                    <div style="display: table-cell; vertical-align: middle;" class="text-center px-1 py-0.5 h-[22px]">
                        <span class="adjust-baseline block font-bold text-red-600 text-[11px] leading-[22px] break-words">${escHtml(wState.dayNotes[i])}</span>
                    </div>
                </div>`;
            }
            if (i === 3 && !st.hasRecord) {
                rowCells += `<div class="flex items-center justify-center h-full opacity-40 py-1"><span class="adjust-baseline text-slate-400 font-bold text-xs">本週無加扣分紀錄 👍</span></div>`;
            }
            (st.records[i] || []).forEach(r => {
                const color = r.points > 0 ? 'text-emerald-600' : 'text-red-600';
                const sign = r.points > 0 ? '+' : '';
                rowCells += `<div class="record-item items-start"><span class="adjust-baseline desc text-[12.5px] font-medium text-slate-800 whitespace-pre-wrap">${escHtml(r.reason)}</span><span class="adjust-baseline score text-[13px] ${color}">${sign}${r.points}</span></div>`;
                if (r.remarks) {
                    const formatted = String(r.remarks).split('\n').map(line => `└ ${escHtml(line)}`).join('\n');
                    rowCells += `<div class="adjust-baseline text-[10.5px] text-gray-500 whitespace-pre-wrap mt-0 pt-0 leading-snug mb-[4px] text-left">${formatted}</div>`;
                }
            });
            rowCells += '</td>';
        }
        rowCells += '</tr>';

        const dayNames = ['星期一', '星期二', '星期三', '星期四', '星期五'];
        const thHeight = isUltraCompact ? 'h-[30px]' : 'h-[34px]';
        const thLine = isUltraCompact ? 'leading-[30px]' : 'leading-[34px]';
        const thHtml = dayNames.map((dName, idx) => `
            <th class="text-center align-middle w-1/5 ${thHeight}">
                <div class="adjust-baseline ${thLine} inline-block w-full">
                    <span class="text-xs text-slate-700 font-bold">${dName}</span>
                    <span class="text-[10.5px] font-bold text-gray-500 font-raleway ml-1">${dayHeaders[idx]}</span>
                </div>
            </th>
        `).join('');

        // 統一顯示「第X週加分、第X週扣分、第X週淨分、第X週總積分、第X週排名（使用截止至該週之班排，不顯示截止字樣）」
        const wName = escHtml(String(wState.weekLabel || '').replace(/\s+/g, ''));
        const statsHeaderHtml = isUltraCompact
            ? `<div class="flex items-center justify-between gap-2 mb-2 bg-white border border-slate-300 rounded-lg px-3 py-1.5">
                <div class="flex items-center gap-2">
                    <span class="adjust-baseline text-sm font-black text-slate-900 bg-slate-200 px-2.5 py-0.5 rounded">${escHtml(wState.weekLabel)}</span>
                    <span class="adjust-baseline text-xs font-bold text-slate-600 font-comfortaa">${formatShortDate(startD)} ~ ${formatShortDate(endD)}</span>
                </div>
                <div class="flex items-center gap-2.5 text-xs font-bold">
                    <span class="adjust-baseline text-slate-600">${wName}加分 <b class="font-comfortaa text-emerald-700">+${st.plus}</b></span>
                    <span class="text-slate-300">|</span>
                    <span class="adjust-baseline text-slate-600">${wName}扣分 <b class="font-comfortaa text-red-600">${st.minus === 0 ? '0' : '-' + st.minus}</b></span>
                    <span class="text-slate-300">|</span>
                    <span class="adjust-baseline text-blue-800 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">${wName}淨分 <b class="font-comfortaa">${st.net >= 0 ? '+' + st.net : st.net}</b></span>
                    <span class="adjust-baseline text-slate-900 bg-gray-100 px-2.5 py-0.5 rounded border-2 border-slate-700">${wName}總積分 <b class="font-comfortaa text-sm">${st.totalScore}</b></span>
                    <span class="adjust-baseline text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-500">${wName}排名 <b class="font-comfortaa">#${st.totalRank}</b></span>
                </div>
            </div>`
            : `<div class="flex gap-2 mb-2.5 w-full items-stretch">
                <div class="info-card w-[26%] p-2.5 flex flex-col justify-between">
                    <div class="flex justify-between w-full mb-1">
                        <span class="adjust-baseline text-[10px] font-bold text-gray-500 leading-none">週次</span>
                        <span class="adjust-baseline text-[10px] font-bold text-gray-500 leading-none">統計區間</span>
                    </div>
                    <div class="flex justify-between w-full items-end">
                        <span class="adjust-baseline text-lg font-black leading-none text-slate-900">${escHtml(wState.weekLabel)}</span>
                        <span class="adjust-baseline text-[13px] font-bold font-comfortaa leading-none text-slate-700">${formatShortDate(startD)} ~ ${formatShortDate(endD)}</span>
                    </div>
                </div>
                <div class="flex flex-1 gap-1.5 items-stretch">
                    <div class="stat-box flex-1 p-2 flex flex-col justify-between">
                        <div class="adjust-baseline text-[10px] font-bold text-text-light mb-1 leading-none">${wName}加分</div>
                        <div class="adjust-baseline text-lg font-black font-comfortaa text-emerald-700 leading-none">+${st.plus}</div>
                    </div>
                    <div class="stat-box flex-1 p-2 flex flex-col justify-between">
                        <div class="adjust-baseline text-[10px] font-bold text-text-light mb-1 leading-none">${wName}扣分</div>
                        <div class="adjust-baseline text-lg font-black font-comfortaa text-red-600 leading-none">${st.minus === 0 ? '0' : '-' + st.minus}</div>
                    </div>
                    <div class="stat-box flex-1 p-2 flex flex-col justify-between border-blue-200 bg-blue-50">
                        <div class="adjust-baseline text-[10px] font-bold text-blue-800 mb-1 leading-none">${wName}淨分</div>
                        <div class="adjust-baseline text-lg font-black font-comfortaa text-blue-700 leading-none">${st.net >= 0 ? '+' + st.net : st.net}</div>
                    </div>
                    <div class="stat-box stat-box-total flex-[1.2] p-2 border-[2px] border-[#374151] bg-[#f3f4f6] flex flex-col justify-between">
                        <div class="adjust-baseline text-[10px] font-extrabold text-slate-800 mb-1 leading-none">${wName}總積分</div>
                        <div class="adjust-baseline text-lg font-black font-comfortaa text-text-main leading-none">${st.totalScore}</div>
                    </div>
                    <div class="stat-box flex-1 p-2 border-emerald-600 bg-emerald-50 border-[2px] flex flex-col justify-between">
                        <div class="adjust-baseline text-[10px] font-bold text-emerald-800 mb-1 leading-none">${wName}排名</div>
                        <div class="adjust-baseline text-lg font-black font-comfortaa text-emerald-600 leading-none">${st.totalRank}</div>
                    </div>
                </div>
            </div>`;

        return `
        <div class="${isMulti ? ('week-section-block' + (isUltraCompact ? ' ultra-compact' : '')) : 'mb-4'}">
            ${statsHeaderHtml}
            <div class="box-wrapper w-full">
                <div class="box-inner">
                    <table class="record-table">
                        <thead><tr>${thHtml}</tr></thead>
                        <tbody>${rowCells}</tbody>
                    </table>
                </div>
            </div>
        </div>`;
    }

    function updatePreview(overrideChunkIdx) {
        if (!weeksList.length) return;
        const seat = getEl('input-seat') ? getEl('input-seat').value : '1';
        const stu = weeksList[0].students[seat];

        const classCommentText = getEl('input-class-comment') ? getEl('input-class-comment').value : '';
        const personalCommentText = getEl('input-comment') ? getEl('input-comment').value : '';

        let finalComment = '';
        if (classCommentText.trim()) finalComment += `【班級宣導】\n${classCommentText.trim()}`;
        if (personalCommentText.trim()) {
            if (finalComment) finalComment += `\n\n`;
            finalComment += `【個人評語】\n${personalCommentText.trim()}`;
        }
        if (getEl('prev-teacher-comment')) getEl('prev-teacher-comment').textContent = finalComment;
        if (getEl('prev-semester')) getEl('prev-semester').textContent = getEl('input-semester') ? getEl('input-semester').value : '--';
        if (getEl('prev-seat')) getEl('prev-seat').textContent = seat || '--';
        if (getEl('prev-name')) getEl('prev-name').textContent = stu ? stu.name : '--';

        const chunks = getPageChunks();
        const cIdx = overrideChunkIdx !== undefined ? overrideChunkIdx : Math.min(activeChunkIndex, chunks.length - 1);
        const currentChunk = chunks[cIdx] || [0];
        const chunkWeeks = currentChunk.map(i => weeksList[i]).filter(Boolean);

        const mainTitle = getEl('prev-main-title');
        if (mainTitle) {
            mainTitle.textContent = '805 生活計點週報表';
        }

        const container = getEl('weeks-render-container');
        container.innerHTML = chunkWeeks.map(w => buildWeekBlockHTML(w, seat, chunkWeeks.length)).join('');
    }

    /* ============ 6. 切換週數 (1~4週) 與分頁方式 ============ */
    function updateModeDescriptions() {
        const desc = getEl('week-mode-desc');
        const chunks = getPageChunks();
        const wCount = weeksList.length;

        getEl('multi-page-mode-wrap').classList.toggle('hidden', wCount === 1);

        if (wCount === 1) {
            desc.innerHTML = '💡 <b>單週模式</b>：產出 1 週報表，「當週結算總分」已修正為<b>只累加到該週結束日為止</b>，回頭補印舊週次也不會印出未來總分！';
            getEl('btn-single-label').textContent = '執行產出 (單人單週)';
            getEl('btn-all-label').textContent = '執行產出 (全班單週)';
            return;
        }

        if (pageSplitMode === 'all_in_one') {
            desc.innerHTML = `💡 <b>${wCount} 週全部同張整合</b>：將連續 ${wCount} 週濃縮排在同一張報表、共用最下方 1 個簽名欄（當週數 ≥ 3 週時自動切換為<b>高密度緊湊排版</b>）！`;
            getEl('btn-single-label').textContent = `執行產出 (單人 ${wCount} 週同張)`;
            getEl('btn-all-label').textContent = `執行產出 (全班 ${wCount} 週同張)`;
        } else if (pageSplitMode === 'two_per_page') {
            desc.innerHTML = `💡 <b>每 2 週合印一張</b>：您選了 ${wCount} 週，系統已自動拆成 <b>${chunks.length} 張雙週報表</b>，字體大小最剛好、又省一半紙張！上方可切換預覽各張。`;
            getEl('btn-single-label').textContent = `執行產出 (單人共 ${chunks.length} 張)`;
            getEl('btn-all-label').textContent = `執行產出 (全班每人 ${chunks.length} 張)`;
        } else {
            desc.innerHTML = `💡 <b>每 1 週獨立一張</b>：按一次產出，系統會自動幫每位學生一次產出 <b>${wCount} 張獨立單週報表</b>（每一張各自帶當週截止的累計總積分）！`;
            getEl('btn-single-label').textContent = `執行產出 (單人一次出 ${wCount} 張)`;
            getEl('btn-all-label').textContent = `執行產出 (全班每人 ${wCount} 張)`;
        }
    }

    function setWeekCount(cnt) {
        selectedWeekCount = cnt;
        document.querySelectorAll('.week-cnt-btn').forEach(btn => {
            const isAct = Number(btn.getAttribute('data-week-count')) === cnt;
            btn.className = isAct
                ? 'week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-rose-500 text-white border-rose-500 shadow-sm'
                : 'week-cnt-btn py-1.5 rounded-xl text-xs font-extrabold border transition bg-white text-slate-600 border-rose-200 hover:bg-rose-50';

        initDemoWeeksData(startW, cnt);

        activeDayNoteWeekIdx = 0;

        pageSplitMode = mode;
        document.querySelectorAll('.page-mode-btn').forEach(btn => {
            const isAct = btn.getAttribute('data-page-mode') === mode;
            btn.className = isAct
                ? 'page-mode-btn px-1 py-1.5 rounded-xl text-[10px] font-bold border transition bg-rose-500 text-white border-rose-500 shadow-sm'
                : 'page-mode-btn px-1 py-1.5 rounded-xl text-[10px] font-bold border transition bg-white text-slate-600 border-rose-200 hover:bg-rose-50';
        });
        activeChunkIndex = 0;
        renderPreviewPageSwitcher();
        updateModeDescriptions();
        updatePreview();
        adjustScale();
    }

    /* ============ 7. 微調各週資料彈窗（支援 1~4 週跨週自動連動總積分！） ============ */
    function openEditModal() {
        const seat = getEl('input-seat').value;
        if (!seat || !weeksList.length) return alert('目前沒有選擇學生');
        tempEditRecordsByWeek = weeksList.map(w => {
            const s = w.students[seat];
            return s ? JSON.parse(JSON.stringify(s.records)) : { 1: [], 2: [], 3: [], 4: [], 5: [] };
        });
        renderModalBody();
        getEl('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() { getEl('edit-modal').classList.add('hidden'); }

    function renderModalBody() {
        const container = getEl('edit-modal-body');
        const days = ['星期一', '星期二', '星期三', '星期四', '星期五'];

        container.innerHTML = weeksList.map((w, wIdx) => {
            const recObj = tempEditRecordsByWeek[wIdx];
            let html = `<div class="mb-6"><h4 class="font-black text-base text-slate-800 mb-3 pb-1 border-b-2 border-teal-500 inline-block">📅 ${escHtml(w.weekLabel)} (${w.startDate} ~ ${w.endDate})</h4>`;
            for (let i = 1; i <= 5; i++) {
                html += `<div class="mb-2.5 bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between mb-1.5">
                        <b class="text-sm text-teal-700">${days[i - 1]}</b>
                        <button type="button" onclick="addTempRecord(${wIdx}, ${i})" class="text-xs bg-teal-100 text-teal-800 px-2.5 py-1 rounded-lg font-bold">+ 新增紀錄</button>
                    </div>`;
                if (!recObj[i] || recObj[i].length === 0) {
                    html += `<div class="text-xs text-gray-400 text-center py-1">無紀錄</div>`;
                } else {
                    recObj[i].forEach((r, idx) => {
                        html += `<div class="flex gap-2 mb-1.5 items-center bg-gray-50 p-2 rounded-lg">
                            <input type="text" value="${escHtml(r.reason)}" onchange="updateTempRecord(${wIdx}, ${i}, ${idx}, 'reason', this.value)" class="flex-1 border p-1.5 text-sm rounded">
                            <input type="number" step="0.5" value="${r.points}" onchange="updateTempRecord(${wIdx}, ${i}, ${idx}, 'points', this.value)" class="w-20 border p-1.5 text-sm rounded text-center font-bold">
                            <input type="text" value="${escHtml(r.remarks)}" onchange="updateTempRecord(${wIdx}, ${i}, ${idx}, 'remarks', this.value)" placeholder="備註" class="flex-1 border p-1.5 text-sm rounded">
                            <button type="button" onclick="removeTempRecord(${wIdx}, ${i}, ${idx})" class="text-red-500 font-bold px-2">✕</button>
                        </div>`;
                    });
                }
                html += `</div>`;
            }
            html += `</div>`;
            return html;
        }).join('');
    }

    window.addTempRecord = function(wIdx, day) {
        tempEditRecordsByWeek[wIdx][day].push({ date: '', reason: '手動新增', points: -1, remarks: '' });
        renderModalBody();
    };
    window.updateTempRecord = function(wIdx, day, idx, field, val) {
        tempEditRecordsByWeek[wIdx][day][idx][field] = field === 'points' ? (parseFloat(val) || 0) : val;
    };
    window.removeTempRecord = function(wIdx, day, idx) {
        tempEditRecordsByWeek[wIdx][day].splice(idx, 1);
        renderModalBody();
    };

    window.saveEditModal = function() {
        const seat = getEl('input-seat').value;
        let cumulativeDiff = 0;

        weeksList.forEach((w, wIdx) => {
            const s = w.students[seat];
            if (!s) return;
            let oldPts = 0, newPts = 0;
            for (let i = 1; i <= 5; i++) {
                (s.records[i] || []).forEach(r => { oldPts += r.points; });
                (tempEditRecordsByWeek[wIdx][i] || []).forEach(r => { newPts += r.points; });
            }
            cumulativeDiff += (newPts - oldPts);
            // ★ 前面週次的加減分變動，會自動往後累加到後面每一週的當週結算總分！
            s.totalScore = parseFloat((s.totalScore + cumulativeDiff).toFixed(1));
            s.records = tempEditRecordsByWeek[wIdx];
            recalculateNetScores(w);
        });

        updatePreview();
        closeEditModal();
    };

    /* ============ 8. 版面比例與匯出 PDF / 列印 ============ */
    function updateFlex() {
        const template = getEl('report-template');
        const orientation = getEl('input-orientation') ? getEl('input-orientation').value : 'landscape';
        const sigLayout = getEl('input-signature-layout') ? getEl('input-signature-layout').value : 'row';
        const container = getEl('signature-container');
        const teacher = getEl('box-teacher');
        const student = getEl('box-student');
        const parent = getEl('box-parent');

        if (template) template.className = `report-page theme-bw relative z-10 shadow-2xl layout-${orientation}`;
        if (!container || !teacher || !student || !parent) return;

        const wT = parseFloat(getEl('input-flex-teacher') ? getEl('input-flex-teacher').value : 45) || 45;
        const wS = parseFloat(getEl('input-flex-student') ? getEl('input-flex-student').value : 25) || 25;
        const wP = parseFloat(getEl('input-flex-parent') ? getEl('input-flex-parent').value : 30) || 30;
        const sigHeight = parseFloat(getEl('input-signature-height') ? getEl('input-signature-height').value : 140) || 140;

        container.style.minHeight = `${sigHeight}px`;
        container.style.height = `auto`;

        if (sigLayout === 'stacked') {
            const rightTotal = wS + wP;
            container.style.gridTemplateColumns = `${wT}fr ${rightTotal}fr`;
            container.style.gridTemplateRows = `${wS}fr ${wP}fr`;
            teacher.style.gridColumn = '1 / 2'; teacher.style.gridRow = '1 / 3';
            student.style.gridColumn = '2 / 3'; student.style.gridRow = '1 / 2';
            parent.style.gridColumn = '2 / 3';  parent.style.gridRow = '2 / 3';
        } else {
            container.style.gridTemplateColumns = `${wT}fr ${wS}fr ${wP}fr`;
            container.style.gridTemplateRows = '1fr';
            teacher.style.gridColumn = '1 / 2'; teacher.style.gridRow = '1 / 2';
            student.style.gridColumn = '2 / 3'; student.style.gridRow = '1 / 2';
            parent.style.gridColumn = '3 / 4';  parent.style.gridRow = '1 / 2';
        }
        adjustScale();
    }

    function adjustScale() {
        const w = getEl('preview-scale-wrapper');
        if (!w || !w.parentElement) return;
        const cw = w.parentElement.clientWidth;
        const baseWidth = 971;
        const scale = cw < (baseWidth + 60) ? (cw - 60) / baseWidth : 1;
        w.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', adjustScale);

    async function performExport(all = false) {
        const mode = getEl('input-export-mode').value;
        window.isExporting = true;
        const loader = getEl('global-loader');
        const printArea = getEl('print-area');
        loader.style.display = 'flex';
        printArea.style.display = 'block';
        printArea.innerHTML = '';

        const currentSeat = getEl('input-seat').value;
        const seats = all ? Object.keys(weeksList[0].students).sort((a, b) => parseInt(a) - parseInt(b)) : [currentSeat];
        const { jsPDF } = window.jspdf;
        let pdf = null;

        const offsetPx = getEl('input-pdf-offset') ? getEl('input-pdf-offset').value : 2;
        let styleTag = document.getElementById('temp-pdf-offset-style');
        if (!styleTag) {
            styleTag = document.createElement('style');
            styleTag.id = 'temp-pdf-offset-style';
            document.head.appendChild(styleTag);
        }
        styleTag.innerHTML = `.exporting-pdf .adjust-baseline { top: -${offsetPx}px !important; }`;

        const chunks = getPageChunks();
        const totalSteps = seats.length * chunks.length;
        let stepCount = 0;

        for (let i = 0; i < seats.length; i++) {
            getEl('input-seat').value = seats[i];
            loadStudentData();

            for (let cIdx = 0; cIdx < chunks.length; cIdx++) {
                stepCount++;
                updatePreview(cIdx);
                await new Promise(r => setTimeout(r, 90));

                const clone = getEl('report-template').cloneNode(true);
                clone.removeAttribute('id');
                clone.querySelectorAll('*').forEach(el => el.removeAttribute('id'));

                clone.style.transform = 'none';
                clone.style.margin = '0';
                clone.style.width = '971px';
                clone.style.height = 'auto';

                if (mode === 'native_print') {
                    if (stepCount < totalSteps) clone.classList.add('page-break');
                    printArea.appendChild(clone);
                } else {
                    clone.classList.add('exporting-pdf');
                    printArea.innerHTML = '';
                    printArea.appendChild(clone);

                    await new Promise(r => setTimeout(r, 50));
                    const w = clone.offsetWidth;
                    const h = clone.offsetHeight;

                    const canvas = await html2canvas(clone, { scale: 2, useCORS: true, logging: false });
                    const imgData = canvas.toDataURL('image/jpeg', 0.98);

                    if (!pdf) {
                        pdf = new jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit: 'px', format: [w, h] });
                    } else {
                        pdf.addPage([w, h], w > h ? 'landscape' : 'portrait');
                    }
                    pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
                    canvas.width = 0;
                    canvas.height = 0;
                }
            }
        }

        if (styleTag) styleTag.innerHTML = '';

        const firstLbl = weeksList[0].weekLabel;
        const lastLbl = weeksList[weeksList.length - 1].weekLabel;
        const fileTitle = weeksList.length === 1 ? firstLbl : `${firstLbl}~${lastLbl}`;

        if (mode === 'native_print') {
            window.print();
        } else if (pdf) {
            pdf.save(`805週報表_${fileTitle}${all ? '_全班' : '_' + currentSeat + '號'}.pdf`);
        }

        printArea.style.display = 'none';
        loader.style.display = 'none';
        getEl('input-seat').value = currentSeat;
        loadStudentData();
        window.isExporting = false;
    }

    /* ============ 9. 初始化與事件綁定 ============ */
    window.addEventListener('DOMContentLoaded', () => {
        initDemoWeeksData(7, 4);
        renderWeekRangesListUI();
        renderDayNoteWeekTabs();
        renderPreviewPageSwitcher();
        updateModeDescriptions();
        updateSeatDropdown();
        updateFlex();

        // 嘗試連線真實試算表
        fetchAllData();

        // 點選 1 週 / 2 週 / 3 週 / 4 週
        document.querySelectorAll('.week-cnt-btn').forEach(btn => {
            btn.addEventListener('click', () => setWeekCount(Number(btn.getAttribute('data-week-count'))));
        });

        // 點選分頁方式（全部同張 / 每2週一張 / 每1週一張）
        document.querySelectorAll('.page-mode-btn').forEach(btn => {
            btn.addEventListener('click', () => setPageSplitMode(btn.getAttribute('data-page-mode')));
        });

        // 修改學期或起始週次時，自動重算連續 N 週的區間並向試算表抓取
        getEl('input-semester').addEventListener('change', () => {
            fetchAllData(true);
        });
        getEl('input-start-week').addEventListener('change', () => {
            setWeekCount(selectedWeekCount);
        });

        getEl('input-seat').addEventListener('change', loadStudentData);
        getEl('btn-refresh-data').addEventListener('click', () => fetchAllData(false));
        getEl('btn-open-edit').addEventListener('click', openEditModal);
        getEl('btn-download-single').addEventListener('click', () => performExport(false));
        getEl('btn-download-all').addEventListener('click', () => performExport(true));

        getEl('input-orientation').addEventListener('change', updateFlex);
        getEl('input-signature-layout').addEventListener('change', updateFlex);
        ['teacher', 'student', 'parent'].forEach(k => {
            getEl(`input-flex-${k}`).addEventListener('input', updateFlex);
        });
        getEl('input-signature-height').addEventListener('input', updateFlex);

        const showSavingStatus = (id) => {
            const el = getEl(id); if (!el) return;
            el.textContent = '儲存中...'; el.className = 'text-[10px] font-bold text-amber-500 opacity-100 transition';
        };
        const showSavedStatus = (id) => {
            const el = getEl(id); if (!el) return;
            el.textContent = '✓ 已存雲端'; el.className = 'text-[10px] font-bold text-emerald-600 opacity-100 transition';
            setTimeout(() => { el.classList.replace('opacity-100', 'opacity-0'); }, 2000);
        };

        // 每日放假備註（針對目前選取的 activeDayNoteWeekIdx 週次）
        let noteSaveTimer;
        for (let i = 1; i <= 5; i++) {
            getEl(`note-day-${i}`).addEventListener('input', (e) => {
                const w = weeksList[activeDayNoteWeekIdx];
                if (!w) return;
                w.dayNotes[i] = e.target.value;
                renderDayNoteWeekTabs();
                updatePreview();
                showSavingStatus('save-status-class');
                clearTimeout(noteSaveTimer);
                noteSaveTimer = setTimeout(async () => {
                    await callBackendAPI('saveWeekDayNotes', { semester: getEl('input-semester').value, week: w.weekLabel, notesObj: w.dayNotes });
                    showSavedStatus('save-status-class');
                }, 1000);
            });
        }

        getEl('input-class-comment').addEventListener('input', (e) => {
            weeksList.forEach(w => { w.dayNotes['classComment'] = e.target.value; });
            updatePreview();
            showSavingStatus('save-status-class');
            clearTimeout(noteSaveTimer);
            noteSaveTimer = setTimeout(async () => {
                const w = weeksList[activeDayNoteWeekIdx] || weeksList[0];
                if (w) {
                    await callBackendAPI('saveWeekDayNotes', { semester: getEl('input-semester').value, week: w.weekLabel, notesObj: w.dayNotes });
                    showSavedStatus('save-status-class');
                }
            }, 1000);
        });

        let cmtTimer;
        getEl('input-comment').addEventListener('input', (e) => {
            const seat = getEl('input-seat').value;
            weeksList.forEach(w => {
                if (w.students[seat]) w.students[seat].comment = e.target.value;
            });
            updatePreview();
            showSavingStatus('save-status-personal');
            clearTimeout(cmtTimer);
            cmtTimer = setTimeout(async () => {
                const lastW = weeksList[weeksList.length - 1];
                if (seat && lastW && lastW.students[seat]) {
                    await callBackendAPI('saveWeeklyComment', {
                        semester: getEl('input-semester').value,
                        week: lastW.weekLabel,
                        seatNo: seat,
                        studentName: lastW.students[seat].name,
                        comment: e.target.value
                    });
                    showSavedStatus('save-status-personal');
                }
            }, 1000);
        });
    });
</script>
</body>
